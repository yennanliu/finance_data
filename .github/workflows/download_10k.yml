name: Download 10-K Reports

# On-demand downloader. Pulls annual reports straight from SEC EDGAR by ticker
# (always current, unlike annualreports.com). 10-K is used by default; foreign
# private issuers that file 20-F instead are detected automatically.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker (e.g. AAPL, MSFT, TSM)"
        required: true
        type: string
      years:
        description: "How many recent years to fetch"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

jobs:
  download-10k:
    name: Download 10-K PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Download report(s)
        run: |
          python scripts/download_10k_edgar.py \
            "${{ github.event.inputs.ticker }}" \
            --years "${{ github.event.inputs.years }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 10-k/
          if git diff --cached --quiet; then
            echo "No new reports downloaded."
          else
            git commit -m "chore: download ${{ github.event.inputs.ticker }} 10-K reports"
            git pull --rebase origin main
            git push
            echo "Reports committed and pushed."
          fi
