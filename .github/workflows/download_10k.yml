name: Download 10-K Reports

on:
  workflow_dispatch:
    inputs:
      company_slug:
        description: "Company slug from annualreports.com (e.g., apple-inc, tesla-inc)"
        required: true
        type: string
      year:
        description: "Specific year to download (leave empty for all available)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  download-10k:
    name: Download 10-K PDF
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Download 10-K report(s)
        run: |
          SLUG="${{ github.event.inputs.company_slug }}"
          YEAR="${{ github.event.inputs.year }}"

          if [ -n "$YEAR" ]; then
            python scripts/download_10k_pdf.py "$SLUG" --start-year "$YEAR" --end-year "$YEAR"
          else
            python scripts/download_10k_pdf.py "$SLUG"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add 10-k/

          if git diff --cached --quiet; then
            echo "No new reports downloaded."
          else
            SLUG="${{ github.event.inputs.company_slug }}"
            YEAR="${{ github.event.inputs.year }}"
            if [ -n "$YEAR" ]; then
              git commit -m "chore: download ${SLUG} 10-K ${YEAR}"
            else
              git commit -m "chore: download ${SLUG} 10-K reports"
            fi
            git pull --rebase origin main
            git push
            echo "Reports committed and pushed."
          fi
