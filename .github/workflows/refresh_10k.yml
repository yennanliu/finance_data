name: Refresh 10-K Reports

# Monthly top-up of the 10-K collection. Iterates every ticker already tracked
# under 10-k/ and pulls any newer annual filings from SEC EDGAR. 10-Ks are
# annual, so once a month is plenty; existing files are skipped, so a run only
# commits genuinely new reports. Runnable on demand via workflow_dispatch.

on:
  schedule:
    - cron: "0 7 1 * *" # 1st of each month, 07:00 UTC
  workflow_dispatch:
    inputs:
      years:
        description: "How many recent years to fetch per ticker"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-10k
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh all tracked tickers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Refresh every tracked ticker
        env:
          YEARS: ${{ github.event.inputs.years || '3' }}
        run: |
          # Tickers = the directory names already under 10-k/ (self-maintaining:
          # download a new company once and it gets refreshed from then on).
          for dir in 10-k/*/; do
            ticker="$(basename "$dir")"
            echo "::group::$ticker"
            python scripts/download_10k_edgar.py "$ticker" --years "$YEARS" || true
            echo "::endgroup::"
          done

      - name: Commit and push new reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 10-k/
          if git diff --cached --quiet; then
            echo "No new reports this month."
          else
            git commit -m "chore: monthly 10-K refresh from SEC EDGAR"
            git pull --rebase origin main
            git push
            echo "New reports committed and pushed."
          fi
