name: Cleanup Refusal Posts

# ── Schedule & Manual Trigger ─────────────────────────────────────
on:
  schedule:
    # 04:10 UTC — after collect_daily.yml lands the cycle (03:50), before
    # deploy.yml publishes (05:00).
    #
    # This used to run at 02:00, which is now too early twice over: it sits
    # inside the generation window (the additional fundamental block runs
    # 02:00-03:40), and a refusal deleted from the branch then would simply be
    # restored when the collector unpacks that report's artifact at 03:50.
    # Cleanup has to see the cycle's content before it can prune it.
    - cron: "10 4 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (list files but don't delete)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      search_pattern:
        description: "Pattern to search for (leave empty for default refusal message)"
        required: false
        default: "抱歉，我無法完成這項請求。"
        type: string
      search_directory:
        description: "Directory to search (leave empty for entire repo)"
        required: false
        default: "."
        type: string
      auto_commit:
        description: "Automatically commit and push changes"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove Files with Refusal Message
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Resolve parameters ─────────────────────────────────
      - name: Resolve parameters
        id: params
        run: |
          PATTERN="${{ github.event.inputs.search_pattern }}"
          PATTERN="${PATTERN:-抱歉，我無法完成這項請求。}"

          DIRECTORY="${{ github.event.inputs.search_directory }}"
          DIRECTORY="${DIRECTORY:-.}"

          echo "search_pattern=$PATTERN" >> $GITHUB_OUTPUT
          echo "search_directory=$DIRECTORY" >> $GITHUB_OUTPUT

          echo "📋 Cleanup Configuration:"
          echo "  Pattern: $PATTERN"
          echo "  Directory: $DIRECTORY"
          echo "  Dry-run: ${{ github.event.inputs.dry_run || 'false' }}"
          echo "  Auto-commit: ${{ github.event.inputs.auto_commit || 'true' }}"

      # ── 3. Find and delete refusal files ───────────────────────
      - name: Find files with refusal message
        id: find
        run: |
          echo "🔍 Searching for refusal message..."
          echo ""

          # Find all files containing the refusal message
          REFUSAL_FILES=$(grep -r "${{ steps.params.outputs.search_pattern }}" "${{ steps.params.outputs.search_directory }}" \
            --include="*.md" \
            --include="*.html" \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=.venv \
            --exclude-dir=node_modules \
            -l 2>/dev/null || true)

          if [ -z "$REFUSAL_FILES" ]; then
            echo "✅ No files with refusal message found."
            echo "files_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found files with refusal message:"
          echo "$REFUSAL_FILES" | while read file; do
            echo "  ❌ $file"
          done

          # Save to output for next step
          echo "$REFUSAL_FILES" > /tmp/refusal_files.txt
          echo "files_found=true" >> $GITHUB_OUTPUT
          echo "file_count=$(echo "$REFUSAL_FILES" | wc -l)" >> $GITHUB_OUTPUT

      # ── 3. Delete files (unless dry-run) ────────────────────────
      - name: Delete refusal files
        if: steps.find.outputs.files_found == 'true'
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "🏜️  DRY RUN MODE - No files will be deleted"
            echo ""
            echo "Files that would be deleted:"
            cat /tmp/refusal_files.txt | while read file; do
              echo "  [WOULD DELETE] $file"
            done
            exit 0
          fi

          echo "🗑️  Deleting files with refusal message..."
          echo ""

          cat /tmp/refusal_files.txt | while read file; do
            if [ -f "$file" ]; then
              rm -f "$file"
              echo "  ✓ Deleted: $file"
            fi
          done

          echo ""
          echo "✅ Cleanup complete"

      # ── 4. Commit and push changes ─────────────────────────────
      - name: Commit and push changes
        if: steps.find.outputs.files_found == 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.auto_commit != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Stage deleted files. -u (tracked only) rather than -A: this job only
          # ever removes tracked files, so -A could sweep in unrelated strays.
          git add -u

          # Commit
          FILE_COUNT=${{ steps.find.outputs.file_count }}
          PATTERN="${{ steps.params.outputs.search_pattern }}"
          DIRECTORY="${{ steps.params.outputs.search_directory }}"

          # NOTE: every line here must stay indented inside the `run: |` block.
          # This message used to be a single -m whose continuation lines sat at
          # column 0, which closed the block scalar and made the whole workflow
          # unparseable — it failed at 0s on every trigger and never ran.
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          BODY=$(printf -- '- Pattern: %s\n- Directory: %s\n- File count: %s\n- Timestamp: %s' \
            "$PATTERN" "$DIRECTORY" "$FILE_COUNT" "$TIMESTAMP")

          git commit \
            -m "chore: cleanup $FILE_COUNT files with refusal message" \
            -m "Automated cleanup: removed files containing pattern" \
            -m "$BODY" \
            -m "[skip ci]"

          # Push to the branch this run is actually on, not a hardcoded "main".
          #
          # `git push origin main` pushes the local *main ref*, which on a
          # workflow_dispatch from a feature branch does not exist — the run
          # dies with "src refspec main does not match any" and the cleanup is
          # lost. Note the fix is NOT `HEAD:main`: that succeeds, and pushes
          # every unreviewed commit on the feature branch straight onto main.
          # Pushing HEAD to the current ref keeps a dispatched run on its own
          # branch, and is identical to the old behaviour for the scheduled run
          # (where GITHUB_REF_NAME is "main").
          #
          # This cron (0 2 * * *) collides with daily_analysis (MU fundamental)
          # and qa_report_quality, so retry around a rebase.
          BRANCH="${GITHUB_REF_NAME}"
          echo "📤 Pushing changes to ${BRANCH}..."
          pushed=""
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "✅ Changes pushed to ${BRANCH}"
              pushed=yes
              break
            fi
            echo "⚠️ Push failed (attempt $i/5), rebasing and retrying in 10s..."
            sleep 10
            git pull --rebase origin "${BRANCH}"
          done

          if [ -z "$pushed" ]; then
            echo "::error::Push failed after 5 attempts — cleanup was NOT persisted."
            exit 1
          fi

      # ── Skip auto-commit notice
      - name: Auto-commit disabled notice
        if: steps.find.outputs.files_found == 'true' && github.event.inputs.dry_run != 'true' && github.event.inputs.auto_commit == 'false'
        run: |
          echo "⚠️  Auto-commit is disabled"
          echo ""
          echo "Files have been deleted but NOT committed:"
          cat /tmp/refusal_files.txt
          echo ""
          echo "To commit manually, run:"
          echo "  git add -A && git commit -m 'chore: cleanup files' && git push"

      # ── 5. Summary ─────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          echo "## Cleanup Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.find.outputs.files_found }}" = "true" ]; then
            echo "**Status:** ✅ Files found and processed" >> $GITHUB_STEP_SUMMARY
            echo "**Count:** ${{ steps.find.outputs.file_count }} files" >> $GITHUB_STEP_SUMMARY

            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "**Mode:** 🏜️ Dry-run (no deletion)" >> $GITHUB_STEP_SUMMARY
            else
              if [ "${{ github.event.inputs.auto_commit }}" = "false" ]; then
                echo "**Mode:** 🗑️ Files deleted (manual commit required)" >> $GITHUB_STEP_SUMMARY
              else
                echo "**Mode:** 🗑️ Cleanup executed & committed" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "**Status:** ✅ No matching files found" >> $GITHUB_STEP_SUMMARY
            echo "**Action:** None required" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "**Search Pattern:** \`${{ steps.params.outputs.search_pattern }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Search Directory:** \`${{ steps.params.outputs.search_directory }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Dry-run:** ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-commit:** ${{ github.event.inputs.auto_commit || 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Schedule:** Daily at 2:00 AM UTC (when triggered automatically)" >> $GITHUB_STEP_SUMMARY
