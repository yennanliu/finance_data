name: Cleanup Refusal Posts

# Deletes reports whose body is an LLM refusal rather than an analysis.
on:
  schedule:
    # Daily at 2:00 AM UTC (10:00 AM Taipei)
    - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (list files but don't delete)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      search_pattern:
        description: "Pattern to search for (leave empty for default refusal message)"
        required: false
        default: "抱歉，我無法完成這項請求。"
        type: string
      search_directory:
        description: "Directory to search (leave empty for entire repo)"
        required: false
        default: "."
        type: string
      auto_commit:
        description: "Automatically commit and push changes"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove Files with Refusal Message
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        # Shallow: the search reads the working tree, not history.

      # ── 2. Resolve parameters ─────────────────────────────────
      # All four inputs are resolved to outputs exactly once here, so no later
      # step has to restate a `|| 'false'` default in an `if:` or an echo.
      - name: Resolve parameters
        id: params
        env:
          IN_PATTERN: ${{ github.event.inputs.search_pattern }}
          IN_DIRECTORY: ${{ github.event.inputs.search_directory }}
          IN_DRY_RUN: ${{ github.event.inputs.dry_run }}
          IN_AUTO_COMMIT: ${{ github.event.inputs.auto_commit }}
        run: |
          set -euo pipefail
          PATTERN="${IN_PATTERN:-抱歉，我無法完成這項請求。}"
          DIRECTORY="${IN_DIRECTORY:-.}"
          DRY_RUN="${IN_DRY_RUN:-false}"
          AUTO_COMMIT="${IN_AUTO_COMMIT:-true}"

          {
            echo "search_pattern=${PATTERN}"
            echo "search_directory=${DIRECTORY}"
            echo "dry_run=${DRY_RUN}"
            echo "auto_commit=${AUTO_COMMIT}"
          } >> "$GITHUB_OUTPUT"

          echo "📋 Cleanup Configuration:"
          echo "  Pattern:     ${PATTERN}"
          echo "  Directory:   ${DIRECTORY}"
          echo "  Dry-run:     ${DRY_RUN}"
          echo "  Auto-commit: ${AUTO_COMMIT}"

      # ── 3. Find matching files ─────────────────────────────────
      - name: Find files with refusal message
        id: find
        env:
          PATTERN: ${{ steps.params.outputs.search_pattern }}
          DIRECTORY: ${{ steps.params.outputs.search_directory }}
        run: |
          set -euo pipefail
          echo "🔍 Searching for refusal message..."

          LIST="$RUNNER_TEMP/refusal_files.txt"
          # Quoted: an unquoted pattern was word-split, so a refusal message
          # containing a space searched for the wrong thing.
          grep -r "$PATTERN" "$DIRECTORY" \
            --include="*.md" \
            --include="*.html" \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=.venv \
            --exclude-dir=node_modules \
            -l > "$LIST" 2>/dev/null || true

          if [ ! -s "$LIST" ]; then
            echo "✅ No files with refusal message found."
            echo "files_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found files with refusal message:"
          sed 's/^/  ❌ /' "$LIST"

          {
            echo "files_found=true"
            echo "file_count=$(wc -l < "$LIST" | tr -d ' ')"
            echo "list=${LIST}"
          } >> "$GITHUB_OUTPUT"

      # ── 4. Delete files (unless dry-run) ───────────────────────
      - name: Delete refusal files
        if: steps.find.outputs.files_found == 'true'
        env:
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          LIST: ${{ steps.find.outputs.list }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "🏜️  DRY RUN MODE — no files will be deleted"
            sed 's/^/  [WOULD DELETE] /' "$LIST"
            exit 0
          fi

          echo "🗑️  Deleting files with refusal message..."
          # -r: a path containing a backslash would otherwise be mangled.
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              rm -f "$file"
              echo "  ✓ Deleted: $file"
            fi
          done < "$LIST"

          echo "✅ Cleanup complete"

      # ── 5. Build the commit message ────────────────────────────
      # Assembled here as a multi-line step output rather than as a stack of
      # `git commit -m` arguments inside a `run: |` block. That construction
      # once had its continuation lines land at column 0, which closed the
      # block scalar and made the whole workflow unparseable — it failed at 0s
      # on every trigger and never ran. A step output cannot break that way.
      - name: Build commit message
        id: msg
        if: >
          steps.find.outputs.files_found == 'true' &&
          steps.params.outputs.dry_run != 'true' &&
          steps.params.outputs.auto_commit != 'false'
        env:
          PATTERN: ${{ steps.params.outputs.search_pattern }}
          DIRECTORY: ${{ steps.params.outputs.search_directory }}
          FILE_COUNT: ${{ steps.find.outputs.file_count }}
        run: |
          set -euo pipefail
          {
            echo "message<<COMMIT_MSG_EOF"
            echo "chore: cleanup ${FILE_COUNT} files with refusal message"
            echo ""
            echo "Automated cleanup: removed files containing pattern"
            echo ""
            echo "- Pattern: ${PATTERN}"
            echo "- Directory: ${DIRECTORY}"
            echo "- File count: ${FILE_COUNT}"
            echo "- Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "[skip ci]"
            echo "COMMIT_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 6. Commit and push ─────────────────────────────────────
      - name: Commit and push changes
        if: >
          steps.find.outputs.files_found == 'true' &&
          steps.params.outputs.dry_run != 'true' &&
          steps.params.outputs.auto_commit != 'false'
        uses: ./.github/actions/commit-and-push
        with:
          paths: "."
          # -u, not --all: this job only ever *removes* tracked files, so
          # --all could sweep in an unrelated untracked stray.
          add-flags: "-u"
          message: ${{ steps.msg.outputs.message }}

      # ── 7. Notices & summary ───────────────────────────────────
      - name: Auto-commit disabled notice
        if: >
          steps.find.outputs.files_found == 'true' &&
          steps.params.outputs.dry_run != 'true' &&
          steps.params.outputs.auto_commit == 'false'
        env:
          LIST: ${{ steps.find.outputs.list }}
        run: |
          echo "⚠️  Auto-commit is disabled"
          echo "Files have been deleted but NOT committed:"
          cat "$LIST"
          echo "To commit manually, run:"
          echo "  git add -u && git commit -m 'chore: cleanup files' && git push"

      - name: Job summary
        if: always()
        env:
          FILES_FOUND: ${{ steps.find.outputs.files_found }}
          FILE_COUNT: ${{ steps.find.outputs.file_count }}
          PATTERN: ${{ steps.params.outputs.search_pattern }}
          DIRECTORY: ${{ steps.params.outputs.search_directory }}
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          AUTO_COMMIT: ${{ steps.params.outputs.auto_commit }}
        run: |
          {
            echo "## Cleanup Job Summary"
            echo ""
            if [ "$FILES_FOUND" = "true" ]; then
              echo "**Status:** ✅ Files found and processed"
              echo "**Count:** ${FILE_COUNT} files"
              if [ "$DRY_RUN" = "true" ]; then
                echo "**Mode:** 🏜️ Dry-run (no deletion)"
              elif [ "$AUTO_COMMIT" = "false" ]; then
                echo "**Mode:** 🗑️ Files deleted (manual commit required)"
              else
                echo "**Mode:** 🗑️ Cleanup executed & committed"
              fi
            else
              echo "**Status:** ✅ No matching files found"
              echo "**Action:** None required"
            fi
            echo ""
            echo "### Configuration"
            echo "**Search Pattern:** \`${PATTERN}\`"
            echo "**Search Directory:** \`${DIRECTORY}\`"
            echo "**Dry-run:** ${DRY_RUN}"
            echo "**Auto-commit:** ${AUTO_COMMIT}"
            echo ""
            echo "**Schedule:** Daily at 2:00 AM UTC (when triggered automatically)"
          } >> "$GITHUB_STEP_SUMMARY"
