name: Daily Market News
run-name: "Daily Market News ${{ github.event.inputs.ticker || github.event.schedule }}"

# ── Schedules (UTC → UTC+8) ──────────────────────────────────────────────────
#   17:00 → 01:00  0050
#   17:10 → 01:10  2330.tw
#   17:20 → 01:20  TSLA
#   17:30 → 01:30  PL
#   17:40 → 01:40  GRAB
#   17:50 → 01:50  TSM
#   18:00 → 02:00  GOOG
#   18:10 → 02:10  AMZN
#   18:20 → 02:20  MSFT
#   18:30 → 02:30  SOFI
#   18:40 → 02:40  PLTR
#   18:50 → 02:50  RKLB
#   19:00 → 03:00  ONDS
#   19:10 → 03:10  AVAV
#   19:20 → 03:20  KTOS
#   19:30 → 03:30  META
#   19:40 → 03:40  AMD
#   19:50 → 03:50  NVDA
#   20:00 → 04:00  NU
#   20:10 → 04:10  VST
#   20:20 → 04:20  ORCL
#   20:30 → 04:30  6206.tw  飛捷
#   20:40 → 04:40  3008.tw  大立光
#   20:50 → 04:50  4766.tw  南寶
#   21:00 → 05:00  6643.tw  M31
#   21:10 → 05:10  2317.tw  鴻海
#   21:20 → 05:20  SPCX
#   21:30 → 05:30  MU
#   21:40 → 05:40  SKHY
#   21:50 → 05:50  WDC
#   22:00 → 06:00  SNDK
#   22:10 → 06:10  MRVL
#   22:20 → 06:20  SOXQ
#   22:30 → 06:30  SOXX
#   22:40 → 06:40  WQTM
#   22:50 → 06:50  VTI
#   23:00 → 07:00  QQQ
#   23:10 → 07:10  ROBO
on:
  schedule:
    - cron: "0 17 * * *"     # 0050
    - cron: "10 17 * * *"    # 2330.tw
    - cron: "20 17 * * *"    # TSLA
    - cron: "30 17 * * *"    # PL
    - cron: "40 17 * * *"    # GRAB
    - cron: "50 17 * * *"    # TSM
    - cron: "0 18 * * *"     # GOOG
    - cron: "10 18 * * *"    # AMZN
    - cron: "20 18 * * *"    # MSFT
    - cron: "30 18 * * *"    # SOFI
    - cron: "40 18 * * *"    # PLTR
    - cron: "50 18 * * *"    # RKLB
    - cron: "0 19 * * *"     # ONDS
    - cron: "10 19 * * *"    # AVAV
    - cron: "20 19 * * *"    # KTOS
    - cron: "30 19 * * *"    # META
    - cron: "40 19 * * *"    # AMD
    - cron: "50 19 * * *"    # NVDA
    - cron: "0 20 * * *"     # NU
    - cron: "10 20 * * *"    # VST
    - cron: "20 20 * * *"    # ORCL
    - cron: "30 20 * * *"    # 6206.tw
    - cron: "40 20 * * *"    # 3008.tw
    - cron: "50 20 * * *"    # 4766.tw
    - cron: "0 21 * * *"     # 6643.tw
    - cron: "10 21 * * *"    # 2317.tw
    - cron: "20 21 * * *"    # SPCX
    - cron: "30 21 * * *"    # MU
    - cron: "40 21 * * *"    # SKHY
    - cron: "50 21 * * *"    # WDC
    - cron: "0 22 * * *"     # SNDK
    - cron: "10 22 * * *"    # MRVL
    - cron: "20 22 * * *"    # SOXQ
    - cron: "30 22 * * *"    # SOXX
    - cron: "40 22 * * *"    # WQTM
    - cron: "50 22 * * *"    # VTI
    - cron: "0 23 * * *"     # QQQ
    - cron: "10 23 * * *"    # ROBO

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA, SPY)"
        required: false
        default: "TSLA"
      provider:
        description: "AI provider"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - openai
          - claude
      model:
        description: "Model ID"
        required: false
        default: "gemini-3.6-flash"
        type: choice
        options:
          # Gemini 3.x models (latest)
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
          - gemini-3.1-flash-lite
          # Gemini 2.5 models (stable)
          - gemini-2.5-flash
          - gemini-2.5-pro
          - gemini-2.5-flash-lite
          # OpenAI models
          - gpt-4o
          - gpt-4o-mini
          - gpt-4-turbo
          # Claude models
          - claude-sonnet-4-6
          - claude-opus-4-6
          - claude-haiku-4-5-20251001
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "20000"

permissions:
  contents: write   # needed to commit & push generated report

concurrency:
  group: "daily-market-news-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  fetch-news:
    name: Fetch & Generate News Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_PROVIDER: gemini
      DEFAULT_MODEL: gemini-3.6-flash
      DEFAULT_MAX_TOKENS: "20000"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic>=0.40.0 openai>=1.0.0 google-genai>=1.0.0 yfinance>=0.2.40

      # ── 4. Resolve parameters ─────────────────────────────────────
      #   workflow_dispatch → use user inputs
      #   scheduled crons   → map ticker via case; provider/model from job env defaults
      - name: Resolve parameters
        id: params
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TICKER="${{ github.event.inputs.ticker }}"
            PROVIDER="${{ github.event.inputs.provider }}"
            MODEL="${{ github.event.inputs.model }}"
            MAX_TOKENS="${{ github.event.inputs.max_tokens }}"
          else
            # Schedule → set only ticker; provider/model use job-level defaults
            case "$SCHEDULE" in
              "0 17 * * *")   TICKER="0050" ;;
              "10 17 * * *")  TICKER="2330.tw" ;;
              "20 17 * * *")  TICKER="TSLA" ;;
              "30 17 * * *")  TICKER="PL" ;;
              "40 17 * * *")  TICKER="GRAB" ;;
              "50 17 * * *")  TICKER="TSM" ;;
              "0 18 * * *")   TICKER="GOOG" ;;
              "10 18 * * *")  TICKER="AMZN" ;;
              "20 18 * * *")  TICKER="MSFT" ;;
              "30 18 * * *")  TICKER="SOFI" ;;
              "40 18 * * *")  TICKER="PLTR" ;;
              "50 18 * * *")  TICKER="RKLB" ;;
              "0 19 * * *")   TICKER="ONDS" ;;
              "10 19 * * *")  TICKER="AVAV" ;;
              "20 19 * * *")  TICKER="KTOS" ;;
              "30 19 * * *")  TICKER="META" ;;
              "40 19 * * *")  TICKER="AMD" ;;
              "50 19 * * *")  TICKER="NVDA" ;;
              "0 20 * * *")   TICKER="NU" ;;
              "10 20 * * *")  TICKER="VST" ;;
              "20 20 * * *")  TICKER="ORCL" ;;
              "30 20 * * *")  TICKER="6206.tw" ;;
              "40 20 * * *")  TICKER="3008.tw" ;;
              "50 20 * * *")  TICKER="4766.tw" ;;
              "0 21 * * *")   TICKER="6643.tw" ;;
              "10 21 * * *")  TICKER="2317.tw" ;;
              "20 21 * * *")  TICKER="SPCX" ;;
              "30 21 * * *")  TICKER="MU" ;;
              "40 21 * * *")  TICKER="SKHY" ;;
              "50 21 * * *")  TICKER="WDC" ;;
              "0 22 * * *")   TICKER="SNDK" ;;
              "10 22 * * *")  TICKER="MRVL" ;;
              "20 22 * * *")  TICKER="SOXQ" ;;
              "30 22 * * *")  TICKER="SOXX" ;;
              "40 22 * * *")  TICKER="WQTM" ;;
              "50 22 * * *")  TICKER="VTI" ;;
              "0 23 * * *")   TICKER="QQQ" ;;
              "10 23 * * *")  TICKER="ROBO" ;;
              *)              TICKER="TSLA" ;;
            esac
          fi

          TICKER="${TICKER:-TSLA}"
          PROVIDER="${PROVIDER:-${DEFAULT_PROVIDER}}"
          MODEL="${MODEL:-${DEFAULT_MODEL}}"
          MAX_TOKENS="${MAX_TOKENS:-${DEFAULT_MAX_TOKENS}}"

          # Auto-correct model when it doesn't match the chosen provider
          case "$PROVIDER" in
            gemini) [[ "$MODEL" != gemini-* ]] && MODEL="gemini-3.6-flash" ;;
            openai) [[ "$MODEL" != gpt-*    ]] && MODEL="gpt-4o" ;;
            claude) [[ "$MODEL" != claude-* ]] && MODEL="claude-sonnet-4-6" ;;
          esac

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          DATE_TIME=$(date -u +"%Y-%m-%d")
          OUTPUT_DIR="ai_gen_report/market_news/${TICKER_LOWER}"
          OUTPUT_FILE="market_news_${DATE_TIME}_${PROVIDER}.md"

          echo "ticker=${TICKER_UPPER}"      >> "$GITHUB_OUTPUT"
          echo "provider=${PROVIDER}"        >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"              >> "$GITHUB_OUTPUT"
          echo "max_tokens=${MAX_TOKENS}"    >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}"    >> "$GITHUB_OUTPUT"
          echo "output_file=${OUTPUT_FILE}"  >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Event:       ${EVENT}"
          echo "  Schedule:    ${SCHEDULE:-n/a}"
          echo "  Ticker:      ${TICKER_UPPER}"
          echo "  Provider:    ${PROVIDER}"
          echo "  Model:       ${MODEL}"
          echo "  Max tokens:  ${MAX_TOKENS}"
          echo "  Output dir:  ${OUTPUT_DIR}"
          echo "  Output file: ${OUTPUT_FILE}"

      # ── 5. Verify API key secret is set ──────────────────────────
      - name: Check API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: ${{ steps.params.outputs.provider }}
        run: |
          if [ "$PROVIDER" = "openai" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPEN_KEY_API secret is not set."
              exit 1
            fi
            echo "✅ OPEN_KEY_API is set."
          elif [ "$PROVIDER" = "gemini" ]; then
            if [ -z "$GEMINI_API_KEY" ]; then
              echo "::error::GEMINI_API_KEY secret is not set."
              exit 1
            fi
            echo "✅ GEMINI_API_KEY is set."
          else
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::error::ANTHROPIC_API_KEY secret is not set."
              exit 1
            fi
            echo "✅ ANTHROPIC_API_KEY is set."
          fi

      # ── 6. Generate news report ───────────────────────────────────
      - name: Generate market news report
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_market_news.py \
            "${{ steps.params.outputs.ticker }}" \
            --output-dir  "${{ steps.params.outputs.output_dir }}" \
            --output-file "${{ steps.params.outputs.output_file }}" \
            --provider    "${{ steps.params.outputs.provider }}" \
            --model       "${{ steps.params.outputs.model }}" \
            --max-tokens  "${{ steps.params.outputs.max_tokens }}"

      # ── 7. Commit & push ──────────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            git commit -m "chore: auto-fetch ${TICKER} market-news ${DATE}"

            echo "📥 Pulling latest changes from remote..."
            git pull --rebase origin main

            echo "📤 Pushing changes to remote..."
            git push
            echo "✅ News report committed and pushed."
          fi
