name: Daily Market News

# ── Schedules (UTC → Taipei) ─────────────────────────────────────────────────
#   01:00 → 09:00  TSLA
#   01:15 → 09:15  PLTR
#   01:30 → 09:30  ONDS
#   01:45 → 09:45  TSM
#   02:00 → 10:00  GOOG
#   02:15 → 10:15  AMZN
#   02:30 → 10:30  SOFI
#   02:45 → 10:45  AMD
#   03:00 → 11:00  MSFT
#   03:15 → 11:15  RKLB
on:
  schedule:
    - cron: "0 1 * * *"    # TSLA
    - cron: "15 1 * * *"   # PLTR
    - cron: "30 1 * * *"   # ONDS
    - cron: "45 1 * * *"   # TSM
    - cron: "0 2 * * *"    # GOOG
    - cron: "15 2 * * *"   # AMZN
    - cron: "30 2 * * *"   # SOFI
    - cron: "45 2 * * *"   # AMD
    - cron: "0 3 * * *"    # MSFT
    - cron: "15 3 * * *"   # RKLB

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA, SPY)"
        required: false
        default: "TSLA"
      model:
        description: "Claude model ID"
        required: false
        default: "claude-sonnet-4-6"
        type: choice
        options:
          - claude-sonnet-4-6
          - claude-opus-4-6
          - claude-haiku-4-5-20251001
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "20000"

permissions:
  contents: write   # needed to commit & push generated report

concurrency:
  group: "daily-market-news-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  fetch-news:
    name: Fetch & Generate News Report
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic>=0.40.0 yfinance>=0.2.40

      # ── 4. Resolve parameters ─────────────────────────────────────
      #   workflow_dispatch → use user inputs
      #   scheduled crons   → map to pre-configured ticker
      - name: Resolve parameters
        id: params
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TICKER="${{ github.event.inputs.ticker }}"
            MODEL="${{ github.event.inputs.model }}"
            MAX_TOKENS="${{ github.event.inputs.max_tokens }}"
          elif [ "$SCHEDULE" = "0 1 * * *" ]; then
            TICKER="TSLA"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "15 1 * * *" ]; then
            TICKER="PLTR"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "30 1 * * *" ]; then
            TICKER="ONDS"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "45 1 * * *" ]; then
            TICKER="TSM"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "0 2 * * *" ]; then
            TICKER="GOOG"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "15 2 * * *" ]; then
            TICKER="AMZN"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "30 2 * * *" ]; then
            TICKER="SOFI"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "45 2 * * *" ]; then
            TICKER="AMD"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "0 3 * * *" ]; then
            TICKER="MSFT"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "15 3 * * *" ]; then
            TICKER="RKLB"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          else
            # Fallback
            TICKER="TSLA"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          fi

          # Apply defaults for empty values
          TICKER="${TICKER:-TSLA}"
          MODEL="${MODEL:-claude-sonnet-4-6}"
          MAX_TOKENS="${MAX_TOKENS:-20000}"

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          OUTPUT_DIR="claude_code/market_news/${TICKER_LOWER}"

          echo "ticker=${TICKER_UPPER}"      >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"              >> "$GITHUB_OUTPUT"
          echo "max_tokens=${MAX_TOKENS}"    >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}"    >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Event:      ${EVENT}"
          echo "  Schedule:   ${SCHEDULE:-n/a}"
          echo "  Ticker:     ${TICKER_UPPER}"
          echo "  Model:      ${MODEL}"
          echo "  Max tokens: ${MAX_TOKENS}"
          echo "  Output dir: ${OUTPUT_DIR}"

      # ── 5. Verify API key secret is set ──────────────────────────
      - name: Check ANTHROPIC_API_KEY secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: ANTHROPIC_API_KEY  |  Value: your Anthropic API key"
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY is set."

      # ── 6. Generate news report ───────────────────────────────────
      - name: Generate market news report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_market_news.py \
            "${{ steps.params.outputs.ticker }}" \
            --output-dir  "${{ steps.params.outputs.output_dir }}" \
            --model       "${{ steps.params.outputs.model }}" \
            --max-tokens  "${{ steps.params.outputs.max_tokens }}"

      # ── 7. Commit & push ──────────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            git commit -m "chore: auto-fetch ${TICKER} market-news ${DATE}"
            git push
            echo "✅ News report committed and pushed."
          fi
