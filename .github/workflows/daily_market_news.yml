name: Daily Market News
run-name: "Daily Market News ${{ github.event.inputs.ticker || github.event.schedule }}"

# One cron slot per ticker, staggered 10 minutes apart. The ticker for each slot
# is named in the inline comment beside the cron and resolved at runtime by the
# "Resolve parameters" step below — `github.event.schedule` is the only thing a
# scheduled run knows about itself. Times are UTC; Taipei is UTC+8.

on:
  schedule:
    - cron: "0 17 * * *"     # 0050
    - cron: "10 17 * * *"    # 2330.tw
    - cron: "20 17 * * *"    # TSLA
    - cron: "30 17 * * *"    # PL
    - cron: "40 17 * * *"    # GRAB
    - cron: "50 17 * * *"    # TSM
    - cron: "0 18 * * *"     # GOOG
    - cron: "10 18 * * *"    # AMZN
    - cron: "20 18 * * *"    # MSFT
    - cron: "30 18 * * *"    # SOFI
    - cron: "40 18 * * *"    # PLTR
    - cron: "50 18 * * *"    # RKLB
    - cron: "0 19 * * *"     # ONDS
    - cron: "10 19 * * *"    # AVAV
    - cron: "20 19 * * *"    # KTOS
    - cron: "30 19 * * *"    # META
    - cron: "40 19 * * *"    # AMD
    - cron: "50 19 * * *"    # NVDA
    - cron: "0 20 * * *"     # NU
    - cron: "10 20 * * *"    # VST
    - cron: "20 20 * * *"    # ORCL
    - cron: "30 20 * * *"    # 6206.tw  飛捷
    - cron: "40 20 * * *"    # 3008.tw  大立光
    - cron: "50 20 * * *"    # 4766.tw  南寶
    - cron: "0 21 * * *"     # 6643.tw  M31
    - cron: "10 21 * * *"    # 2317.tw  鴻海
    - cron: "20 21 * * *"    # SPCX
    - cron: "30 21 * * *"    # MU
    - cron: "40 21 * * *"    # SKHY
    - cron: "50 21 * * *"    # WDC
    - cron: "0 22 * * *"     # SNDK
    - cron: "10 22 * * *"    # MRVL
    - cron: "20 22 * * *"    # SOXQ
    - cron: "30 22 * * *"    # SOXX
    - cron: "40 22 * * *"    # WQTM
    - cron: "50 22 * * *"    # VTI
    - cron: "0 23 * * *"     # QQQ
    - cron: "10 23 * * *"    # ROBO

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA, SPY)"
        required: false
        default: "TSLA"
      provider:
        description: "Primary AI provider (falls back through the configured chain)"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - openai
          - claude
      model:
        description: "Model ID (ignored if it does not belong to the chosen provider)"
        required: false
        default: "gemini-3.7-flash"
        type: choice
        # Kept in the same grouping/order as daily_analysis.yml and
        # advanced_analysis.yml: workflow_dispatch choices cannot be shared
        # between files, so the next model addition should be a copy-paste
        # rather than a three-way merge.
        options:
          # OpenAI models
          - gpt-5.6-luna
          - gpt-5.6-terra
          - gpt-5.6-sol
          - gpt-4o
          - gpt-4o-mini
          - gpt-4-turbo
          # Gemini 3.x models (latest)
          - gemini-3.8-flash
          - gemini-3.7-flash
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
          - gemini-3.1-flash-lite
          # Gemini 2.5 models (stable)
          - gemini-2.5-flash
          - gemini-2.5-pro
          - gemini-2.5-flash-lite
          # Claude models
          - claude-sonnet-4-6
          - claude-opus-4-6
          - claude-haiku-4-5-20251001
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "20000"

permissions:
  contents: write   # needed to commit & push generated report

concurrency:
  # Per cron slot (= per ticker); see the note in daily_analysis.yml for why
  # this is not run_id-keyed and not one static group.
  group: "daily-market-news-${{ github.event.schedule || github.event.inputs.ticker || github.run_id }}"
  cancel-in-progress: false

jobs:
  fetch-news:
    name: Fetch & Generate News Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # News runs deliberately differ from the report generators' defaults in
      # analysis/config (gemini-3.8-flash / 32000 tokens), so those values are
      # owned here rather than inherited.
      DEFAULT_PROVIDER: gemini
      DEFAULT_MODEL: gemini-3.7-flash
      DEFAULT_MAX_TOKENS: "20000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Shallow: nothing here reads history, and the pack is ~1 GB, so a full
        # clone cost ~37 pointless deep fetches a day.

      - name: Set up Python and dependencies
        uses: ./.github/actions/python-env
        with:
          packages: >-
            anthropic>=0.40.0
            openai>=1.0.0
            google-genai>=1.0.0
            yfinance>=0.2.40

      - name: Resolve parameters
        id: params
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_TICKER: ${{ github.event.inputs.ticker }}
          IN_PROVIDER: ${{ github.event.inputs.provider }}
          IN_MODEL: ${{ github.event.inputs.model }}
          IN_MAX_TOKENS: ${{ github.event.inputs.max_tokens }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TICKER="${IN_TICKER:-TSLA}"
            PROVIDER="${IN_PROVIDER:-$DEFAULT_PROVIDER}"
            MODEL="${IN_MODEL:-$DEFAULT_MODEL}"
            MAX_TOKENS="${IN_MAX_TOKENS:-$DEFAULT_MAX_TOKENS}"
          else
            PROVIDER="$DEFAULT_PROVIDER"
            MODEL="$DEFAULT_MODEL"
            MAX_TOKENS="$DEFAULT_MAX_TOKENS"
            case "$SCHEDULE" in
              "0 17 * * *")   TICKER="0050" ;;
              "10 17 * * *")  TICKER="2330.tw" ;;
              "20 17 * * *")  TICKER="TSLA" ;;
              "30 17 * * *")  TICKER="PL" ;;
              "40 17 * * *")  TICKER="GRAB" ;;
              "50 17 * * *")  TICKER="TSM" ;;
              "0 18 * * *")   TICKER="GOOG" ;;
              "10 18 * * *")  TICKER="AMZN" ;;
              "20 18 * * *")  TICKER="MSFT" ;;
              "30 18 * * *")  TICKER="SOFI" ;;
              "40 18 * * *")  TICKER="PLTR" ;;
              "50 18 * * *")  TICKER="RKLB" ;;
              "0 19 * * *")   TICKER="ONDS" ;;
              "10 19 * * *")  TICKER="AVAV" ;;
              "20 19 * * *")  TICKER="KTOS" ;;
              "30 19 * * *")  TICKER="META" ;;
              "40 19 * * *")  TICKER="AMD" ;;
              "50 19 * * *")  TICKER="NVDA" ;;
              "0 20 * * *")   TICKER="NU" ;;
              "10 20 * * *")  TICKER="VST" ;;
              "20 20 * * *")  TICKER="ORCL" ;;
              "30 20 * * *")  TICKER="6206.tw" ;;
              "40 20 * * *")  TICKER="3008.tw" ;;
              "50 20 * * *")  TICKER="4766.tw" ;;
              "0 21 * * *")   TICKER="6643.tw" ;;
              "10 21 * * *")  TICKER="2317.tw" ;;
              "20 21 * * *")  TICKER="SPCX" ;;
              "30 21 * * *")  TICKER="MU" ;;
              "40 21 * * *")  TICKER="SKHY" ;;
              "50 21 * * *")  TICKER="WDC" ;;
              "0 22 * * *")   TICKER="SNDK" ;;
              "10 22 * * *")  TICKER="MRVL" ;;
              "20 22 * * *")  TICKER="SOXQ" ;;
              "30 22 * * *")  TICKER="SOXX" ;;
              "40 22 * * *")  TICKER="WQTM" ;;
              "50 22 * * *")  TICKER="VTI" ;;
              "0 23 * * *")   TICKER="QQQ" ;;
              "10 23 * * *")  TICKER="ROBO" ;;
              # No silent default. A cron with no arm here used to fall through
              # to a TSLA report — an unnoticed duplicate rather than a visible
              # failure. Fail loudly so the gap gets fixed.
              *)
                echo "::error::No ticker mapped for cron '${SCHEDULE}' — add an arm to this case statement."
                exit 1
                ;;
            esac
          fi

          {
            echo "ticker=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')"
            echo "provider=${PROVIDER}"
            echo "model=${MODEL}"
            echo "max_tokens=${MAX_TOKENS}"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Event:      ${EVENT}"
          echo "  Schedule:   ${SCHEDULE:-n/a}"
          echo "  Ticker:     ${TICKER}"
          echo "  Provider:   ${PROVIDER}"
          echo "  Model:      ${MODEL}"
          echo "  Max tokens: ${MAX_TOKENS}"

      # Checks the key for the primary provider AND every fallback level, so a
      # fallback attempt never runs without its key.
      - name: Check provider API key secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: ${{ steps.params.outputs.provider }}
          MODEL: ${{ steps.params.outputs.model }}
        run: python scripts/check_provider_keys.py

      # Neither --output-dir nor --output-file is passed. The script already
      # defaults to ai_gen_report/market_news/<ticker>/ and names the file
      # market_news_<date>_<provider>.md using the provider that ACTUALLY
      # served the report. Forcing the filename from here used to stamp it with
      # the *requested* provider, so a gemini→openai fallback produced a file
      # labelled gemini that disagreed with its own front matter.
      - name: Generate market news report
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKER: ${{ steps.params.outputs.ticker }}
          PROVIDER: ${{ steps.params.outputs.provider }}
          MODEL: ${{ steps.params.outputs.model }}
          MAX_TOKENS: ${{ steps.params.outputs.max_tokens }}
        run: |
          python scripts/generate_market_news.py \
            "$TICKER" \
            --provider   "$PROVIDER" \
            --model      "$MODEL" \
            --max-tokens "$MAX_TOKENS"

      - name: Commit and push report
        uses: ./.github/actions/commit-and-push
        with:
          paths: ai_gen_report
          message: >-
            chore: auto-fetch ${{ steps.params.outputs.ticker }} market-news
            ${{ steps.params.outputs.date }}
