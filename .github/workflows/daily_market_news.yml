name: Daily Market News

# ── Schedules (UTC → UTC+8) ──────────────────────────────────────────────────
#   17:00 → 01:00  0050
#   17:10 → 01:10  2330.tw
#   17:20 → 01:20  TSLA
#   17:30 → 01:30  PL
#   17:40 → 01:40  GRAB
#   17:50 → 01:50  TSM
#   18:00 → 02:00  GOOG
#   18:10 → 02:10  AMZN
#   18:20 → 02:20  MSFT
#   18:30 → 02:30  SOFI
#   18:40 → 02:40  PLTR
#   18:50 → 02:50  RKLB
#   19:00 → 03:00  ONDS
#   19:10 → 03:10  AVAV
#   19:20 → 03:20  KTOS
#   19:30 → 03:30  META
#   19:40 → 03:40  AMD
#   19:50 → 03:50  NVDA
#   20:00 → 04:00  NU
#   20:10 → 04:10  VST
#   20:20 → 04:20  ORCL
on:
  schedule:
    - cron: "0 17 * * *"     # 0050
    - cron: "10 17 * * *"    # 2330.tw
    - cron: "20 17 * * *"    # TSLA
    - cron: "30 17 * * *"    # PL
    - cron: "40 17 * * *"    # GRAB
    - cron: "50 17 * * *"    # TSM
    - cron: "0 18 * * *"     # GOOG
    - cron: "10 18 * * *"    # AMZN
    - cron: "20 18 * * *"    # MSFT
    - cron: "30 18 * * *"    # SOFI
    - cron: "40 18 * * *"    # PLTR
    - cron: "50 18 * * *"    # RKLB
    - cron: "0 19 * * *"     # ONDS
    - cron: "10 19 * * *"    # AVAV
    - cron: "20 19 * * *"    # KTOS
    - cron: "30 19 * * *"    # META
    - cron: "40 19 * * *"    # AMD
    - cron: "50 19 * * *"    # NVDA
    - cron: "0 20 * * *"     # NU
    - cron: "10 20 * * *"    # VST
    - cron: "20 20 * * *"    # ORCL

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA, SPY)"
        required: false
        default: "TSLA"
      provider:
        description: "AI provider"
        required: false
        default: "openai"
        type: choice
        options:
          - openai
          - claude
      model:
        description: "Model ID"
        required: false
        default: "gpt-4o"
        type: choice
        options:
          # OpenAI models
          - gpt-4o
          - gpt-4o-mini
          - gpt-4-turbo
          # Claude models
          - claude-sonnet-4-6
          - claude-opus-4-6
          - claude-haiku-4-5-20251001
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "20000"

permissions:
  contents: write   # needed to commit & push generated report

concurrency:
  group: "daily-market-news-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  fetch-news:
    name: Fetch & Generate News Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic>=0.40.0 openai>=1.0.0 yfinance>=0.2.40

      # ── 4. Resolve parameters ─────────────────────────────────────
      #   workflow_dispatch → use user inputs
      #   scheduled crons   → map to pre-configured ticker
      - name: Resolve parameters
        id: params
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TICKER="${{ github.event.inputs.ticker }}"
            PROVIDER="${{ github.event.inputs.provider }}"
            MODEL="${{ github.event.inputs.model }}"
            MAX_TOKENS="${{ github.event.inputs.max_tokens }}"
          elif [ "$SCHEDULE" = "0 17 * * *" ]; then
            TICKER="0050"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "10 17 * * *" ]; then
            TICKER="2330.tw"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "20 17 * * *" ]; then
            TICKER="TSLA"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "30 17 * * *" ]; then
            TICKER="PL"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "40 17 * * *" ]; then
            TICKER="GRAB"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "50 17 * * *" ]; then
            TICKER="TSM"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "0 18 * * *" ]; then
            TICKER="GOOG"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "10 18 * * *" ]; then
            TICKER="AMZN"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "20 18 * * *" ]; then
            TICKER="MSFT"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "30 18 * * *" ]; then
            TICKER="SOFI"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "40 18 * * *" ]; then
            TICKER="PLTR"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "50 18 * * *" ]; then
            TICKER="RKLB"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "0 19 * * *" ]; then
            TICKER="ONDS"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "10 19 * * *" ]; then
            TICKER="AVAV"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "20 19 * * *" ]; then
            TICKER="KTOS"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "30 19 * * *" ]; then
            TICKER="META"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "40 19 * * *" ]; then
            TICKER="AMD"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "50 19 * * *" ]; then
            TICKER="NVDA"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "0 20 * * *" ]; then
            TICKER="NU"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "10 20 * * *" ]; then
            TICKER="VST"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          elif [ "$SCHEDULE" = "20 20 * * *" ]; then
            TICKER="ORCL"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          else
            # Fallback
            TICKER="TSLA"
            PROVIDER="openai"
            MODEL="gpt-4o"
            MAX_TOKENS="16000"
          fi

          # Apply defaults for empty values
          TICKER="${TICKER:-TSLA}"
          PROVIDER="${PROVIDER:-openai}"
          MODEL="${MODEL:-gpt-4o}"
          MAX_TOKENS="${MAX_TOKENS:-20000}"

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          DATE_TIME=$(date -u +"%Y-%m-%d")
          OUTPUT_DIR="ai_gen_report/market_news/${TICKER_LOWER}"
          OUTPUT_FILE="market_news_${DATE_TIME}_${PROVIDER}.md"

          echo "ticker=${TICKER_UPPER}"      >> "$GITHUB_OUTPUT"
          echo "provider=${PROVIDER}"        >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"              >> "$GITHUB_OUTPUT"
          echo "max_tokens=${MAX_TOKENS}"    >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}"    >> "$GITHUB_OUTPUT"
          echo "output_file=${OUTPUT_FILE}"  >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Event:      ${EVENT}"
          echo "  Schedule:   ${SCHEDULE:-n/a}"
          echo "  Ticker:     ${TICKER_UPPER}"
          echo "  Provider:   ${PROVIDER}"
          echo "  Model:      ${MODEL}"
          echo "  Max tokens: ${MAX_TOKENS}"
          echo "  Output dir: ${OUTPUT_DIR}"
          echo "  Output file: ${OUTPUT_FILE}"

      # ── 5. Verify API key secret is set ──────────────────────────
      - name: Check API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          PROVIDER: ${{ steps.params.outputs.provider }}
        run: |
          if [ "$PROVIDER" = "openai" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPEN_KEY_API secret is not set."
              echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
              echo "Name: OPEN_KEY_API  |  Value: your OpenAI API key"
              exit 1
            fi
            echo "✅ OPEN_KEY_API is set."
          else
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::error::ANTHROPIC_API_KEY secret is not set."
              echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
              echo "Name: ANTHROPIC_API_KEY  |  Value: your Anthropic API key"
              exit 1
            fi
            echo "✅ ANTHROPIC_API_KEY is set."
          fi

      # ── 6. Generate news report ───────────────────────────────────
      - name: Generate market news report
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
        run: |
          PROVIDER="${{ steps.params.outputs.provider }}"
          if [ "$PROVIDER" = "openai" ]; then
            SCRIPT="scripts/generate_market_news_openai.py"
          else
            SCRIPT="scripts/generate_market_news_claude.py"
          fi
          python "$SCRIPT" \
            "${{ steps.params.outputs.ticker }}" \
            --output-dir  "${{ steps.params.outputs.output_dir }}" \
            --output-file "${{ steps.params.outputs.output_file }}" \
            --model       "${{ steps.params.outputs.model }}" \
            --max-tokens  "${{ steps.params.outputs.max_tokens }}"

      # ── 7. Commit & push ──────────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest changes to avoid conflicts with concurrent jobs
          echo "📥 Pulling latest changes from remote..."
          git pull --rebase origin main

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            git commit -m "chore: auto-fetch ${TICKER} market-news ${DATE}"

            echo "📤 Pushing changes to remote..."
            git push
            echo "✅ News report committed and pushed."
          fi
