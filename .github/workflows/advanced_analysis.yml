name: Advanced Stock Analysis
run-name: "Advanced Stock Analysis ${{ github.event.inputs.ticker }}"

# Handles analysis types that benefit from extra inputs:
#   earnings-call-analysis  — optional transcript URL
#   insider-trading         — SEC Form 4 insider activity
#   institutional-ownership — 13F institutional holdings
#   report-generator        — interactive HTML report

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker (e.g. AAPL, TSLA, NVDA)"
        required: true
        default: "AAPL"
      analysis_type:
        description: "Analysis type"
        required: true
        default: "earnings-call-analysis"
        type: choice
        options:
          - earnings-call-analysis
          - insider-trading
          - institutional-ownership
          - report-generator
      transcript_url:
        description: "[earnings-call] Earnings transcript URL (optional — leave blank to use Yahoo Finance data)"
        required: false
        default: ""
      provider:
        description: "Primary AI provider (falls back through the configured chain)"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - openai
          - claude
      model:
        description: "Model ID (ignored if it does not belong to the chosen provider)"
        required: false
        default: "gemini-3.8-flash"
        type: choice
        # Kept in the same grouping/order as daily_analysis.yml and
        # daily_market_news.yml: workflow_dispatch choices cannot be shared
        # between files, so the next model addition should be a copy-paste
        # rather than a three-way merge.
        options:
          # OpenAI models
          - gpt-5.6-luna
          - gpt-5.6-terra
          - gpt-5.6-sol
          - gpt-4o
          - gpt-4o-mini
          - gpt-4-turbo
          # Gemini 3.x models (latest)
          - gemini-3.8-flash
          - gemini-3.7-flash
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
          - gemini-3.1-flash-lite
          # Gemini 2.5 models (stable)
          - gemini-2.5-flash
          - gemini-2.5-pro
          - gemini-2.5-flash-lite
          # Claude models
          - claude-sonnet-4-6
          - claude-opus-4-6
          - claude-haiku-4-5-20251001
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "20000"

permissions:
  contents: write

concurrency:
  # Per ticker — two dispatches for different tickers may run concurrently, but
  # the same ticker must not race itself onto the same output path.
  # (Was run_id-keyed = a no-op.)
  group: "advanced-analysis-${{ github.event.inputs.ticker }}"
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Advanced Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Shallow: nothing here reads history, and the pack is ~1 GB.

      - name: Set up Python and dependencies
        uses: ./.github/actions/python-env
        with:
          packages: >-
            anthropic>=0.40.0
            openai>=1.0.0
            google-genai>=1.0.0
            yfinance>=0.2.40

      - name: Resolve analysis parameters
        id: params
        env:
          IN_TICKER: ${{ github.event.inputs.ticker }}
          IN_ANALYSIS_TYPE: ${{ github.event.inputs.analysis_type }}
        run: |
          set -euo pipefail
          TICKER="$(echo "${IN_TICKER:-AAPL}" | tr '[:lower:]' '[:upper:]')"

          {
            echo "ticker=${TICKER}"
            echo "analysis_type=${IN_ANALYSIS_TYPE:-earnings-call-analysis}"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Ticker:        ${TICKER}"
          echo "  Analysis type: ${IN_ANALYSIS_TYPE:-earnings-call-analysis}"

      - name: Fetch transcript content (if URL provided)
        id: transcript
        if: >
          github.event.inputs.analysis_type == 'earnings-call-analysis' &&
          github.event.inputs.transcript_url != ''
        env:
          URL: ${{ github.event.inputs.transcript_url }}
        run: |
          echo "Fetching transcript from: ${URL}"
          TRANSCRIPT=$(curl -fsSL --max-time 30 "$URL" \
            | python3 -c "
          import sys, re
          raw = sys.stdin.read()
          # Strip HTML tags if present
          text = re.sub(r'<[^>]+>', ' ', raw)
          text = re.sub(r'\s+', ' ', text).strip()
          # Limit to 12000 chars to fit in context
          print(text[:12000])
          " 2>/dev/null || echo "")

          if [ -n "$TRANSCRIPT" ]; then
            {
              echo "transcript_content<<EOF"
              echo "$TRANSCRIPT"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "✅ Transcript fetched (${#TRANSCRIPT} chars)"
          else
            echo "transcript_content=" >> "$GITHUB_OUTPUT"
            echo "⚠️  Could not fetch transcript, falling back to Yahoo Finance data."
          fi

      # Checks the key for the primary provider AND every fallback level, so a
      # fallback attempt never runs without its key.
      - name: Check provider API key secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: ${{ github.event.inputs.provider }}
          MODEL: ${{ github.event.inputs.model }}
        run: python scripts/check_provider_keys.py

      # --output-dir is deliberately not passed: every analysis type handled
      # here lands in ai_gen_report/stock/<ticker>/, which is exactly what
      # generate_analysis.py defaults to.
      - name: Generate analysis report
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSCRIPT_CONTENT: ${{ steps.transcript.outputs.transcript_content }}
          TICKER: ${{ steps.params.outputs.ticker }}
          ANALYSIS_TYPE: ${{ steps.params.outputs.analysis_type }}
          PROVIDER: ${{ github.event.inputs.provider }}
          MODEL: ${{ github.event.inputs.model }}
          MAX_TOKENS: ${{ github.event.inputs.max_tokens }}
        run: |
          set -euo pipefail
          ARGS=(--analysis-type "$ANALYSIS_TYPE")
          [ -n "$PROVIDER" ]   && ARGS+=(--provider "$PROVIDER")
          [ -n "$MODEL" ]      && ARGS+=(--model "$MODEL")
          [ -n "$MAX_TOKENS" ] && ARGS+=(--max-tokens "$MAX_TOKENS")
          python scripts/generate_analysis.py "$TICKER" "${ARGS[@]}"

      - name: Commit and push report
        uses: ./.github/actions/commit-and-push
        with:
          paths: ai_gen_report
          message: >-
            chore: auto-generate ${{ steps.params.outputs.ticker }}
            ${{ steps.params.outputs.analysis_type }}
            ${{ steps.params.outputs.date }}
