name: Update Price Data

# Maintains data/prices/<ticker>.csv — the committed 10-year OHLCV store that is
# the single source of truth for every chart on the site (scripts/update_prices.py,
# design notes in docs/PRICE_STORE_DESIGN.md).
#
# The chart payloads pages actually fetch are *derived* from this store by
# scripts/build_docs.py at docs-build time and are not committed.
#
# Runs shortly before the consolidated nightly deploy (deploy.yml, 04:00 UTC)
# so freshly-committed prices are picked up in the same publish cycle. Neither
# data/ nor ai_gen_report/ is a deploy.yml trigger path, so committing here does
# not fire an extra deploy — the nightly cron handles it.
#
# Known and benign: 03:30 UTC is after the US close but *mid-session* in Taipei,
# so TW tickers (2330.TW, 0050) store a provisional bar that the next run
# corrects. Harmless — a fetched bar always wins over a stored one — and it
# predates the store (the old JSON job had exactly the same timing).

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC — after the US close, before the 04:00 deploy
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated tickers to refresh (empty = full universe)"
        required: false
        default: ""

permissions:
  contents: read    # output goes to an artifact; only collect_daily.yml writes

concurrency:
  group: "update-kline-data"
  cancel-in-progress: false

jobs:
  update-kline:
    name: Fetch OHLCV and commit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install "yfinance>=0.2"

      - name: Update price store
        run: |
          TICKERS="${{ github.event.inputs.tickers }}"
          python scripts/update_prices.py $TICKERS

      # Hands off to collect_daily.yml rather than committing.
      - name: Resolve cycle name
        id: cycle
        run: echo "date=$(python scripts/cycle.py)" >> "$GITHUB_OUTPUT"

      - name: Stage price data
        id: stage
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/cycle-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          git add -A data/prices/ 2>/dev/null || true

          # Line counts make an unexpected full-file rewrite obvious in the log
          # — an ordinary night is one appended line per ticker.
          git diff --cached --stat -- data/prices/ | tail -1

          COUNT=0
          while IFS= read -r -d '' f; do
            mkdir -p "$STAGE/$(dirname "$f")"
            cp "$f" "$STAGE/$f"
            COUNT=$((COUNT + 1))
          done < <(git diff --cached --name-only --diff-filter=ACM -z)

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          echo "📦 Staged $COUNT file(s) for cycle ${{ steps.cycle.outputs.date }}."

      - name: Upload price artifact
        if: steps.stage.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ steps.cycle.outputs.date }}-prices
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: 7
