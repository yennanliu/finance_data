name: Daily Stock Analysis

# ── Schedules ────────────────────────────────────────────────────────────────
#   02:00 UTC = 10:00 AM Taipei  →  AAPL fundamental-analysis
#   03:00 UTC = 11:00 AM Taipei  →  TSLA technical-analysis
on:
  schedule:
    - cron: "0 2 * * *"   # AAPL fundamental-analysis
    - cron: "0 3 * * *"   # TSLA technical-analysis

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA, SPY)"
        required: false
        default: "AAPL"
      analysis_type:
        description: "Analysis type"
        required: false
        default: "fundamental-analysis"
        type: choice
        options:
          - fundamental-analysis
          - technical-analysis
          - stock-eval
          - economics-analysis
          - portfolio-review
          - sector-analysis
      model:
        description: "Claude model ID"
        required: false
        default: "claude-sonnet-4-6"
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "8000"

permissions:
  contents: write   # needed to commit & push generated report

concurrency:
  group: "daily-analysis-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Analysis
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic>=0.40.0 yfinance>=0.2.40

      # ── 4. Resolve parameters ─────────────────────────────────────
      #   workflow_dispatch → use user inputs
      #   schedule 0 2 * * *  → AAPL / fundamental-analysis
      #   schedule 0 3 * * *  → TSLA / technical-analysis
      - name: Resolve analysis parameters
        id: params
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TICKER="${{ github.event.inputs.ticker }}"
            ANALYSIS_TYPE="${{ github.event.inputs.analysis_type }}"
            MODEL="${{ github.event.inputs.model }}"
            MAX_TOKENS="${{ github.event.inputs.max_tokens }}"
          elif [ "$SCHEDULE" = "0 2 * * *" ]; then
            TICKER="AAPL"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="8000"
          elif [ "$SCHEDULE" = "0 3 * * *" ]; then
            TICKER="TSLA"
            ANALYSIS_TYPE="technical-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="8000"
          else
            # Fallback
            TICKER="AAPL"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="8000"
          fi

          # Apply defaults for empty values
          TICKER="${TICKER:-AAPL}"
          ANALYSIS_TYPE="${ANALYSIS_TYPE:-fundamental-analysis}"
          MODEL="${MODEL:-claude-sonnet-4-6}"
          MAX_TOKENS="${MAX_TOKENS:-8000}"

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          OUTPUT_DIR="claude_code/${TICKER_LOWER}"

          echo "ticker=${TICKER_UPPER}"          >> "$GITHUB_OUTPUT"
          echo "analysis_type=${ANALYSIS_TYPE}"  >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"                  >> "$GITHUB_OUTPUT"
          echo "max_tokens=${MAX_TOKENS}"         >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}"         >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Event:         ${EVENT}"
          echo "  Schedule:      ${SCHEDULE:-n/a}"
          echo "  Ticker:        ${TICKER_UPPER}"
          echo "  Analysis type: ${ANALYSIS_TYPE}"
          echo "  Model:         ${MODEL}"
          echo "  Max tokens:    ${MAX_TOKENS}"
          echo "  Output dir:    ${OUTPUT_DIR}"

      # ── 5. Verify API key secret is set ──────────────────────────
      - name: Check ANTHROPIC_API_KEY secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: ANTHROPIC_API_KEY  |  Value: your Anthropic API key"
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY is set."

      # ── 6. Generate report ────────────────────────────────────────
      - name: Generate analysis report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_analysis.py \
            "${{ steps.params.outputs.ticker }}" \
            --analysis-type "${{ steps.params.outputs.analysis_type }}" \
            --output-dir    "${{ steps.params.outputs.output_dir }}" \
            --model         "${{ steps.params.outputs.model }}" \
            --max-tokens    "${{ steps.params.outputs.max_tokens }}"

      # ── 7. Commit & push ──────────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            ATYPE="${{ steps.params.outputs.analysis_type }}"
            git commit -m "chore: auto-generate ${TICKER} ${ATYPE} ${DATE}"
            git push
            echo "✅ Report committed and pushed."
          fi
