name: Daily Stock Analysis
run-name: "Daily Stock Analysis ${{ github.event.inputs.ticker || github.event.schedule }}"

# ── Schedules (UTC → UTC+8) ──────────────────────────────────────────────────
# Fundamental Analysis Schedule (17:00 - 21:00 UTC)
#   17:00 → 01:00  0050          fundamental
#   17:10 → 01:10  2330.tw       fundamental
#   17:20 → 01:20  TSLA          fundamental
#   17:30 → 01:30  PL            fundamental
#   17:40 → 01:40  GRAB          fundamental
#   17:50 → 01:50  TSM           fundamental
#   18:00 → 02:00  GOOG          fundamental
#   18:10 → 02:10  AMZN          fundamental
#   18:20 → 02:20  MSFT          fundamental
#   18:30 → 02:30  SOFI          fundamental
#   18:40 → 02:40  PLTR          fundamental
#   18:50 → 02:50  RKLB          fundamental
#   19:00 → 03:00  ONDS          fundamental
#   19:10 → 03:10  AVAV          fundamental
#   19:20 → 03:20  KTOS          fundamental
#   19:30 → 03:30  META          fundamental
#   19:40 → 03:40  AMD           fundamental
#   19:50 → 03:50  NVDA          fundamental
#   20:00 → 04:00  NU            fundamental
#   20:10 → 04:10  VST           fundamental
#   20:20 → 04:20  ORCL          fundamental
#   20:30 → 04:30  INTC          fundamental
#   20:40 → 04:40  SPCX          fundamental
#   20:50 → 04:50  AVGO          fundamental
#   21:00 → 05:00  NBIS          fundamental
#
# Technical Analysis Schedule (21:30 - 01:30 UTC)
#   21:30 → 05:30  0050          technical
#   21:40 → 05:40  2330.tw       technical
#   21:50 → 05:50  TSLA          technical
#   22:00 → 06:00  PL            technical
#   22:10 → 06:10  GRAB          technical
#   22:20 → 06:20  TSM           technical
#   22:30 → 06:30  GOOG          technical
#   22:40 → 06:40  AMZN          technical
#   22:50 → 06:50  MSFT          technical
#   23:00 → 07:00  SOFI          technical
#   23:10 → 07:10  PLTR          technical
#   23:20 → 07:20  RKLB          technical
#   23:30 → 07:30  ONDS          technical
#   23:40 → 07:40  AVAV          technical
#   23:50 → 07:50  KTOS          technical
#   00:00 → 08:00  META          technical
#   00:10 → 08:10  AMD           technical
#   00:20 → 08:20  NVDA          technical
#   00:30 → 08:30  NU            technical
#   00:40 → 08:40  VST           technical
#   00:50 → 08:50  ORCL          technical
#   01:00 → 09:00  INTC          technical
#   01:10 → 09:10  SPCX          technical
#   01:20 → 09:20  AVGO          technical
#   01:30 → 09:30  NBIS          technical
#
# Additional Fundamental Analysis Schedule (02:00 - 03:40 UTC)
#   02:00 → 10:00  MU            fundamental
#   02:10 → 10:10  SKHY          fundamental
#   02:20 → 10:20  WDC           fundamental
#   02:30 → 10:30  SNDK          fundamental
#   02:40 → 10:40  MRVL          fundamental
#   02:50 → 10:50  SOXQ          fundamental
#   03:00 → 11:00  SOXX          fundamental
#   03:10 → 11:10  WQTM          fundamental
#   03:20 → 11:20  VTI           fundamental
#   03:30 → 11:30  QQQ           fundamental
#   03:40 → 11:40  ROBO          fundamental
on:
  schedule:
    # ── Fundamental Analysis ──
    - cron: "0 17 * * *"     # 0050 fundamental
    - cron: "10 17 * * *"    # 2330.tw fundamental
    - cron: "20 17 * * *"    # TSLA fundamental
    - cron: "30 17 * * *"    # PL fundamental
    - cron: "40 17 * * *"    # GRAB fundamental
    - cron: "50 17 * * *"    # TSM fundamental
    - cron: "0 18 * * *"     # GOOG fundamental
    - cron: "10 18 * * *"    # AMZN fundamental
    - cron: "20 18 * * *"    # MSFT fundamental
    - cron: "30 18 * * *"    # SOFI fundamental
    - cron: "40 18 * * *"    # PLTR fundamental
    - cron: "50 18 * * *"    # RKLB fundamental
    - cron: "0 19 * * *"     # ONDS fundamental
    - cron: "10 19 * * *"    # AVAV fundamental
    - cron: "20 19 * * *"    # KTOS fundamental
    - cron: "30 19 * * *"    # META fundamental
    - cron: "40 19 * * *"    # AMD fundamental
    - cron: "50 19 * * *"    # NVDA fundamental
    - cron: "0 20 * * *"     # NU fundamental
    - cron: "10 20 * * *"    # VST fundamental
    - cron: "20 20 * * *"    # ORCL fundamental
    - cron: "30 20 * * *"    # INTC fundamental
    - cron: "40 20 * * *"    # SPCX fundamental
    - cron: "50 20 * * *"    # AVGO fundamental
    - cron: "0 21 * * *"     # NBIS fundamental
    # ── Technical Analysis ──
    - cron: "30 21 * * *"    # 0050 technical
    - cron: "40 21 * * *"    # 2330.tw technical
    - cron: "50 21 * * *"    # TSLA technical
    - cron: "0 22 * * *"     # PL technical
    - cron: "10 22 * * *"    # GRAB technical
    - cron: "20 22 * * *"    # TSM technical
    - cron: "30 22 * * *"    # GOOG technical
    - cron: "40 22 * * *"    # AMZN technical
    - cron: "50 22 * * *"    # MSFT technical
    - cron: "0 23 * * *"     # SOFI technical
    - cron: "10 23 * * *"    # PLTR technical
    - cron: "20 23 * * *"    # RKLB technical
    - cron: "30 23 * * *"    # ONDS technical
    - cron: "40 23 * * *"    # AVAV technical
    - cron: "50 23 * * *"    # KTOS technical
    - cron: "0 0 * * *"      # META technical
    - cron: "10 0 * * *"     # AMD technical
    - cron: "20 0 * * *"     # NVDA technical
    - cron: "30 0 * * *"     # NU technical
    - cron: "40 0 * * *"     # VST technical
    - cron: "50 0 * * *"     # ORCL technical
    - cron: "0 1 * * *"      # INTC technical
    - cron: "10 1 * * *"     # SPCX technical
    - cron: "20 1 * * *"     # AVGO technical
    - cron: "30 1 * * *"     # NBIS technical
    # ── Additional Fundamental ──
    - cron: "0 2 * * *"      # MU fundamental
    - cron: "10 2 * * *"     # SKHY fundamental
    - cron: "20 2 * * *"     # WDC fundamental
    - cron: "30 2 * * *"     # SNDK fundamental
    - cron: "40 2 * * *"     # MRVL fundamental
    - cron: "50 2 * * *"     # SOXQ fundamental
    - cron: "0 3 * * *"      # SOXX fundamental
    - cron: "10 3 * * *"     # WQTM fundamental
    - cron: "20 3 * * *"     # VTI fundamental
    - cron: "30 3 * * *"     # QQQ fundamental
    - cron: "40 3 * * *"     # ROBO fundamental

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA, SPY)"
        required: false
        default: "AAPL"
      analysis_type:
        description: "Analysis type"
        required: false
        default: "fundamental-analysis"
        type: choice
        options:
          - fundamental-analysis
          - technical-analysis
          - stock-eval
          - economics-analysis
          - portfolio-review
          - sector-analysis
          - earnings-call-analysis
          - insider-trading
          - institutional-ownership
          - report-generator
          - financial-report-analyst
          - stock-valuation
      provider:
        description: "AI provider"
        required: false
        default: "openai"
        type: choice
        options:
          - openai
          - gemini
          - claude
      model:
        description: "Model ID"
        required: false
        default: "gpt-5.6-luna"
        type: choice
        options:
          # OpenAI models
          - gpt-5.6-luna
          - gpt-5.6-terra
          - gpt-5.6-sol
          - gpt-4o
          - gpt-4o-mini
          - gpt-4-turbo
          # Gemini 3.x models (latest)
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
          - gemini-3.1-flash-lite
          # Gemini 2.5 models (stable)
          - gemini-2.5-flash
          - gemini-2.5-pro
          - gemini-2.5-flash-lite
          # Claude models
          - claude-sonnet-4-6
          - claude-opus-4-6
          - claude-haiku-4-5-20251001
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "32000"

permissions:
  contents: write   # needed to commit & push generated report
  actions: write    # needed to update workflow run display_title

concurrency:
  group: "daily-analysis-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEFAULT_PROVIDER: openai
      DEFAULT_MODEL: gpt-5.6-luna
      DEFAULT_MAX_TOKENS: "32000"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic>=0.40.0 openai>=1.0.0 google-genai>=1.0.0 yfinance>=0.2.40 matplotlib>=3.8.0 mplfinance>=0.12.10 plotly>=5.0.0

      # ── 4. Resolve parameters ─────────────────────────────────────
      #   workflow_dispatch → use user inputs
      #   scheduled crons   → map ticker/type via case; provider/model from job env defaults
      - name: Resolve analysis parameters
        id: params
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TICKER="${{ github.event.inputs.ticker }}"
            ANALYSIS_TYPE="${{ github.event.inputs.analysis_type }}"
            PROVIDER="${{ github.event.inputs.provider }}"
            MODEL="${{ github.event.inputs.model }}"
            MAX_TOKENS="${{ github.event.inputs.max_tokens }}"
          else
            # Schedule → set only ticker + analysis type; provider/model use job-level defaults
            case "$SCHEDULE" in
              # ── Fundamental ────────────────────────────────────────
              "0 17 * * *")   TICKER="0050";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "10 17 * * *")  TICKER="2330.tw"; ANALYSIS_TYPE="fundamental-analysis" ;;
              "20 17 * * *")  TICKER="TSLA";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "30 17 * * *")  TICKER="PL";      ANALYSIS_TYPE="fundamental-analysis" ;;
              "40 17 * * *")  TICKER="GRAB";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "50 17 * * *")  TICKER="TSM";     ANALYSIS_TYPE="fundamental-analysis" ;;
              "0 18 * * *")   TICKER="GOOG";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "10 18 * * *")  TICKER="AMZN";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "20 18 * * *")  TICKER="MSFT";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "30 18 * * *")  TICKER="SOFI";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "40 18 * * *")  TICKER="PLTR";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "50 18 * * *")  TICKER="RKLB";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "0 19 * * *")   TICKER="ONDS";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "10 19 * * *")  TICKER="AVAV";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "20 19 * * *")  TICKER="KTOS";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "30 19 * * *")  TICKER="META";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "40 19 * * *")  TICKER="AMD";     ANALYSIS_TYPE="fundamental-analysis" ;;
              "50 19 * * *")  TICKER="NVDA";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "0 20 * * *")   TICKER="NU";      ANALYSIS_TYPE="fundamental-analysis" ;;
              "10 20 * * *")  TICKER="VST";     ANALYSIS_TYPE="fundamental-analysis" ;;
              "20 20 * * *")  TICKER="ORCL";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "30 20 * * *")  TICKER="INTC";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "40 20 * * *")  TICKER="SPCX";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "50 20 * * *")  TICKER="AVGO";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "0 21 * * *")   TICKER="NBIS";    ANALYSIS_TYPE="fundamental-analysis" ;;
              # ── Technical ──────────────────────────────────────────
              "30 21 * * *")  TICKER="0050";    ANALYSIS_TYPE="technical-analysis" ;;
              "40 21 * * *")  TICKER="2330.tw"; ANALYSIS_TYPE="technical-analysis" ;;
              "50 21 * * *")  TICKER="TSLA";    ANALYSIS_TYPE="technical-analysis" ;;
              "0 22 * * *")   TICKER="PL";      ANALYSIS_TYPE="technical-analysis" ;;
              "10 22 * * *")  TICKER="GRAB";    ANALYSIS_TYPE="technical-analysis" ;;
              "20 22 * * *")  TICKER="TSM";     ANALYSIS_TYPE="technical-analysis" ;;
              "30 22 * * *")  TICKER="GOOG";    ANALYSIS_TYPE="technical-analysis" ;;
              "40 22 * * *")  TICKER="AMZN";    ANALYSIS_TYPE="technical-analysis" ;;
              "50 22 * * *")  TICKER="MSFT";    ANALYSIS_TYPE="technical-analysis" ;;
              "0 23 * * *")   TICKER="SOFI";    ANALYSIS_TYPE="technical-analysis" ;;
              "10 23 * * *")  TICKER="PLTR";    ANALYSIS_TYPE="technical-analysis" ;;
              "20 23 * * *")  TICKER="RKLB";    ANALYSIS_TYPE="technical-analysis" ;;
              "30 23 * * *")  TICKER="ONDS";    ANALYSIS_TYPE="technical-analysis" ;;
              "40 23 * * *")  TICKER="AVAV";    ANALYSIS_TYPE="technical-analysis" ;;
              "50 23 * * *")  TICKER="KTOS";    ANALYSIS_TYPE="technical-analysis" ;;
              "0 0 * * *")    TICKER="META";    ANALYSIS_TYPE="technical-analysis" ;;
              "10 0 * * *")   TICKER="AMD";     ANALYSIS_TYPE="technical-analysis" ;;
              "20 0 * * *")   TICKER="NVDA";    ANALYSIS_TYPE="technical-analysis" ;;
              "30 0 * * *")   TICKER="NU";      ANALYSIS_TYPE="technical-analysis" ;;
              "40 0 * * *")   TICKER="VST";     ANALYSIS_TYPE="technical-analysis" ;;
              "50 0 * * *")   TICKER="ORCL";    ANALYSIS_TYPE="technical-analysis" ;;
              "0 1 * * *")    TICKER="INTC";    ANALYSIS_TYPE="technical-analysis" ;;
              "10 1 * * *")   TICKER="SPCX";    ANALYSIS_TYPE="technical-analysis" ;;
              "20 1 * * *")   TICKER="AVGO";    ANALYSIS_TYPE="technical-analysis" ;;
              "30 1 * * *")   TICKER="NBIS";    ANALYSIS_TYPE="technical-analysis" ;;
              # ── Additional Fundamental ─────────────────────────────
              "0 2 * * *")    TICKER="MU";      ANALYSIS_TYPE="fundamental-analysis" ;;
              "10 2 * * *")   TICKER="SKHY";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "20 2 * * *")   TICKER="WDC";     ANALYSIS_TYPE="fundamental-analysis" ;;
              "30 2 * * *")   TICKER="SNDK";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "40 2 * * *")   TICKER="MRVL";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "50 2 * * *")   TICKER="SOXQ";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "0 3 * * *")    TICKER="SOXX";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "10 3 * * *")   TICKER="WQTM";    ANALYSIS_TYPE="fundamental-analysis" ;;
              "20 3 * * *")   TICKER="VTI";     ANALYSIS_TYPE="fundamental-analysis" ;;
              "30 3 * * *")   TICKER="QQQ";     ANALYSIS_TYPE="fundamental-analysis" ;;
              "40 3 * * *")   TICKER="ROBO";    ANALYSIS_TYPE="fundamental-analysis" ;;
              *)              TICKER="TSLA";    ANALYSIS_TYPE="fundamental-analysis" ;;
            esac
          fi

          TICKER="${TICKER:-AAPL}"
          ANALYSIS_TYPE="${ANALYSIS_TYPE:-fundamental-analysis}"
          PROVIDER="${PROVIDER:-${DEFAULT_PROVIDER}}"
          MODEL="${MODEL:-${DEFAULT_MODEL}}"
          MAX_TOKENS="${MAX_TOKENS:-${DEFAULT_MAX_TOKENS}}"

          # Auto-correct model when it doesn't match the chosen provider
          case "$PROVIDER" in
            gemini) [[ "$MODEL" != gemini-* ]] && MODEL="gemini-3.6-flash" ;;
            openai) [[ "$MODEL" != gpt-*    ]] && MODEL="gpt-5.6-luna" ;;
            claude) [[ "$MODEL" != claude-* ]] && MODEL="claude-sonnet-4-6" ;;
          esac

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          case "$ANALYSIS_TYPE" in
            fundamental-analysis) OUTPUT_DIR="ai_gen_report/fundamental/${TICKER_LOWER}" ;;
            technical-analysis)   OUTPUT_DIR="ai_gen_report/technical/${TICKER_LOWER}" ;;
            *)                    OUTPUT_DIR="ai_gen_report/stock/${TICKER_LOWER}" ;;
          esac

          echo "ticker=${TICKER_UPPER}"          >> "$GITHUB_OUTPUT"
          echo "analysis_type=${ANALYSIS_TYPE}"  >> "$GITHUB_OUTPUT"
          echo "provider=${PROVIDER}"            >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"                  >> "$GITHUB_OUTPUT"
          echo "max_tokens=${MAX_TOKENS}"        >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}"        >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Event:         ${EVENT}"
          echo "  Schedule:      ${SCHEDULE:-n/a}"
          echo "  Ticker:        ${TICKER_UPPER}"
          echo "  Analysis type: ${ANALYSIS_TYPE}"
          echo "  Provider:      ${PROVIDER}"
          echo "  Model:         ${MODEL}"
          echo "  Max tokens:    ${MAX_TOKENS}"
          echo "  Output dir:    ${OUTPUT_DIR}"

      # ── 5. Update workflow run title ─────────────────────────────
      - name: Update workflow run title
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TICKER="${{ steps.params.outputs.ticker }}"
          ATYPE="${{ steps.params.outputs.analysis_type }}"
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f "display_title=Daily Stock Analysis ${TICKER} ${ATYPE}"

      # ── 6. Verify API key secret is set ──────────────────────────
      - name: Check API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: ${{ steps.params.outputs.provider }}
        run: |
          if [ "$PROVIDER" = "openai" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPEN_KEY_API secret is not set."
              exit 1
            fi
            echo "✅ OPEN_KEY_API is set."
          elif [ "$PROVIDER" = "gemini" ]; then
            if [ -z "$GEMINI_API_KEY" ]; then
              echo "::error::GEMINI_API_KEY secret is not set."
              exit 1
            fi
            echo "✅ GEMINI_API_KEY is set."
          else
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::error::ANTHROPIC_API_KEY secret is not set."
              exit 1
            fi
            echo "✅ ANTHROPIC_API_KEY is set."
          fi

      # ── 7. Generate report ────────────────────────────────────────
      - name: Generate analysis report
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKER: ${{ steps.params.outputs.ticker }}
          ANALYSIS_TYPE: ${{ steps.params.outputs.analysis_type }}
          OUTPUT_DIR: ${{ steps.params.outputs.output_dir }}
          PROVIDER: ${{ steps.params.outputs.provider }}
          MODEL: ${{ steps.params.outputs.model }}
          MAX_TOKENS: ${{ steps.params.outputs.max_tokens }}
        run: |
          python scripts/generate_analysis.py \
            "$TICKER" \
            --analysis-type "$ANALYSIS_TYPE" \
            --provider      "$PROVIDER" \
            --output-dir    "$OUTPUT_DIR" \
            --model         "$MODEL" \
            --max-tokens    "$MAX_TOKENS"

      # ── 8. Commit & push ──────────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash generated files so git pull --rebase can run cleanly
          echo "📦 Stashing generated files..."
          git stash --include-untracked || true

          echo "📥 Pulling latest changes from remote..."
          git pull --rebase origin main

          # Restore generated files
          echo "📂 Restoring generated files..."
          git stash pop || true

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            ATYPE="${{ steps.params.outputs.analysis_type }}"
            git commit -m "chore: auto-generate ${TICKER} ${ATYPE} ${DATE}"

            echo "📤 Pushing changes to remote..."
            for i in 1 2 3 4 5; do
              git push && echo "✅ Report committed and pushed." && break
              echo "⚠️ Push failed (attempt $i/5), rebasing and retrying in 10s..."
              sleep 10
              git stash
              git pull --rebase origin main
              git stash pop || true
            done
          fi
