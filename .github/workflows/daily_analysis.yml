name: Daily Stock Analysis

# ── Schedules (UTC → UTC+8) ──────────────────────────────────────────────────
#   17:00 → 01:00  0050
#   17:13 → 01:13  2330.tw
#   17:26 → 01:26  TSLA
#   17:39 → 01:39  PL
#   17:52 → 01:52  GRAB
#   18:05 → 02:05  TSM
#   18:18 → 02:18  GOOG
#   18:31 → 02:31  AMZN
#   18:44 → 02:44  MSFT
#   18:57 → 02:57  SOFI
#   19:10 → 03:10  PLTR
#   19:23 → 03:23  RKLB
#   19:36 → 03:36  ONDS
#   19:49 → 03:49  AVAV
#   20:02 → 04:02  KTOS
#   20:15 → 04:15  META
#   20:28 → 04:28  AMD
#   20:41 → 04:41  NVDA
on:
  schedule:
    - cron: "0 17 * * *"    # 0050
    - cron: "13 17 * * *"   # 2330.tw
    - cron: "26 17 * * *"   # TSLA
    - cron: "39 17 * * *"   # PL
    - cron: "52 17 * * *"   # GRAB
    - cron: "5 18 * * *"    # TSM
    - cron: "18 18 * * *"   # GOOG
    - cron: "31 18 * * *"   # AMZN
    - cron: "44 18 * * *"   # MSFT
    - cron: "57 18 * * *"   # SOFI
    - cron: "10 19 * * *"   # PLTR
    - cron: "23 19 * * *"   # RKLB
    - cron: "36 19 * * *"   # ONDS
    - cron: "49 19 * * *"   # AVAV
    - cron: "2 20 * * *"    # KTOS
    - cron: "15 20 * * *"   # META
    - cron: "28 20 * * *"   # AMD
    - cron: "41 20 * * *"   # NVDA

  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker symbol (e.g. AAPL, TSLA, NVDA, SPY)"
        required: false
        default: "AAPL"
      analysis_type:
        description: "Analysis type"
        required: false
        default: "fundamental-analysis"
        type: choice
        options:
          - fundamental-analysis
          - technical-analysis
          - stock-eval
          - economics-analysis
          - portfolio-review
          - sector-analysis
          - earnings-call-analysis
          - insider-trading
          - institutional-ownership
          - report-generator
          - financial-report-analyst
          - stock-valuation
      provider:
        description: "AI provider"
        required: false
        default: "claude"
        type: choice
        options:
          - claude
          - openai
      model:
        description: "Model ID (Claude: claude-sonnet-4-6, claude-opus-4-6; OpenAI: gpt-4o, gpt-4-turbo)"
        required: false
        default: "claude-sonnet-4-6"
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "20000"

permissions:
  contents: write   # needed to commit & push generated report

concurrency:
  group: "daily-analysis-${{ github.run_id }}"
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install anthropic>=0.40.0 openai>=1.0.0 yfinance>=0.2.40

      # ── 4. Resolve parameters ─────────────────────────────────────
      #   workflow_dispatch → use user inputs
      #   scheduled crons   → map to pre-configured ticker
      - name: Resolve analysis parameters
        id: params
        run: |
          EVENT="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            TICKER="${{ github.event.inputs.ticker }}"
            ANALYSIS_TYPE="${{ github.event.inputs.analysis_type }}"
            PROVIDER="${{ github.event.inputs.provider }}"
            MODEL="${{ github.event.inputs.model }}"
            MAX_TOKENS="${{ github.event.inputs.max_tokens }}"
          elif [ "$SCHEDULE" = "0 17 * * *" ]; then
            TICKER="0050"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "13 17 * * *" ]; then
            TICKER="2330.tw"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "26 17 * * *" ]; then
            TICKER="TSLA"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "39 17 * * *" ]; then
            TICKER="PL"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "52 17 * * *" ]; then
            TICKER="GRAB"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "5 18 * * *" ]; then
            TICKER="TSM"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "18 18 * * *" ]; then
            TICKER="GOOG"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "31 18 * * *" ]; then
            TICKER="AMZN"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "44 18 * * *" ]; then
            TICKER="MSFT"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "57 18 * * *" ]; then
            TICKER="SOFI"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "10 19 * * *" ]; then
            TICKER="PLTR"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "23 19 * * *" ]; then
            TICKER="RKLB"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "36 19 * * *" ]; then
            TICKER="ONDS"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "49 19 * * *" ]; then
            TICKER="AVAV"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "2 20 * * *" ]; then
            TICKER="KTOS"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "15 20 * * *" ]; then
            TICKER="META"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "28 20 * * *" ]; then
            TICKER="AMD"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          elif [ "$SCHEDULE" = "41 20 * * *" ]; then
            TICKER="NVDA"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          else
            # Fallback
            TICKER="TSLA"
            ANALYSIS_TYPE="fundamental-analysis"
            MODEL="claude-sonnet-4-6"
            MAX_TOKENS="20000"
          fi

          # Apply defaults for empty values
          TICKER="${TICKER:-AAPL}"
          ANALYSIS_TYPE="${ANALYSIS_TYPE:-fundamental-analysis}"
          PROVIDER="${PROVIDER:-claude}"
          MODEL="${MODEL:-claude-sonnet-4-6}"
          MAX_TOKENS="${MAX_TOKENS:-20000}"

          TICKER_UPPER=$(echo "$TICKER" | tr '[:lower:]' '[:upper:]')
          TICKER_LOWER=$(echo "$TICKER" | tr '[:upper:]' '[:lower:]')
          OUTPUT_DIR="claude_code/${TICKER_LOWER}"

          echo "ticker=${TICKER_UPPER}"          >> "$GITHUB_OUTPUT"
          echo "analysis_type=${ANALYSIS_TYPE}"  >> "$GITHUB_OUTPUT"
          echo "provider=${PROVIDER}"            >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}"                  >> "$GITHUB_OUTPUT"
          echo "max_tokens=${MAX_TOKENS}"         >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}"         >> "$GITHUB_OUTPUT"

          echo "=== Parameters ==="
          echo "  Event:         ${EVENT}"
          echo "  Schedule:      ${SCHEDULE:-n/a}"
          echo "  Ticker:        ${TICKER_UPPER}"
          echo "  Analysis type: ${ANALYSIS_TYPE}"
          echo "  Provider:      ${PROVIDER}"
          echo "  Model:         ${MODEL}"
          echo "  Max tokens:    ${MAX_TOKENS}"
          echo "  Output dir:    ${OUTPUT_DIR}"

      # ── 5. Verify API key secret is set ──────────────────────────
      - name: Check API key secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          PROVIDER: ${{ steps.params.outputs.provider }}
        run: |
          if [ "$PROVIDER" = "openai" ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              echo "::error::OPEN_KEY_API secret is not set."
              echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
              echo "Name: OPEN_KEY_API  |  Value: your OpenAI API key"
              exit 1
            fi
            echo "✅ OPEN_KEY_API is set."
          else
            if [ -z "$ANTHROPIC_API_KEY" ]; then
              echo "::error::ANTHROPIC_API_KEY secret is not set."
              echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
              echo "Name: ANTHROPIC_API_KEY  |  Value: your Anthropic API key"
              exit 1
            fi
            echo "✅ ANTHROPIC_API_KEY is set."
          fi

      # ── 6. Generate report ────────────────────────────────────────
      - name: Generate analysis report
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
        run: |
          python scripts/generate_analysis.py \
            "${{ steps.params.outputs.ticker }}" \
            --analysis-type "${{ steps.params.outputs.analysis_type }}" \
            --output-dir    "${{ steps.params.outputs.output_dir }}" \
            --provider      "${{ steps.params.outputs.provider }}" \
            --model         "${{ steps.params.outputs.model }}" \
            --max-tokens    "${{ steps.params.outputs.max_tokens }}"

      # ── 7. Commit & push ──────────────────────────────────────────
      - name: Commit and push report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull latest changes to avoid conflicts with concurrent jobs
          echo "📥 Pulling latest changes from remote..."
          git pull --rebase origin main

          git add "${{ steps.params.outputs.output_dir }}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d")
            TICKER="${{ steps.params.outputs.ticker }}"
            ATYPE="${{ steps.params.outputs.analysis_type }}"
            git commit -m "chore: auto-generate ${TICKER} ${ATYPE} ${DATE}"

            echo "📤 Pushing changes to remote..."
            git push
            echo "✅ Report committed and pushed."
          fi
