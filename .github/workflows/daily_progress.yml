name: Daily Progress Summary

# The nightly cron moved into collect_daily.yml.
#
# This workflow derived its summary from `git log --since="12 hours ago"`,
# which only worked while every report arrived as its own commit. A cycle now
# lands as a single commit, so that scan would return either nothing (running
# mid-cycle at 00:40, as it used to) or one undifferentiated commit. The
# collector builds the same summary from its exact file list instead — see
# scripts/build_progress.py.
#
# Kept dispatch-only for ad-hoc regeneration against whatever is on main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    name: Generate Progress Summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate progress file
        run: |
          YYYYMMDD=$(date -u +"%Y%m%d")
          ANALYSIS_BASE_URL="https://yennanliu.github.io/finance_data/reports"
          NEWS_BASE_URL="https://yennanliu.github.io/finance_data/market_news"
          OUT="progress/progress_${YYYYMMDD}.txt"

          mkdir -p progress

          {
            echo "### Stock Analysis"
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              TICKER=$(echo "$FILE" | sed -E 's#ai_gen_report/(stock|fundamental|technical)/##; s#/.*##')
              FILENAME=$(basename "$FILE" .md)
              URL="${ANALYSIS_BASE_URL}/${TICKER}/${FILENAME}/"
              echo "- [${TICKER^^} ${FILENAME}](${URL})"
            done < <(git log --since="12 hours ago" --name-only --pretty=format: -- ai_gen_report/stock ai_gen_report/fundamental ai_gen_report/technical | grep '\.md$' | sort -u)

            if [ -d ai_gen_report/market_news ]; then
              echo ""
              echo "### Market News"
              while IFS= read -r FILE; do
                [ -z "$FILE" ] && continue
                TICKER=$(echo "$FILE" | sed 's|ai_gen_report/market_news/||; s|/.*||')
                FILENAME=$(basename "$FILE" .md)
                URL="${NEWS_BASE_URL}/${TICKER}/${FILENAME}/"
                echo "- [${TICKER^^} ${FILENAME}](${URL})"
              done < <(git log --since="12 hours ago" --name-only --pretty=format: -- ai_gen_report/market_news | grep '\.md$' | sort -u)
            fi
          } > "$OUT"

          cat "$OUT"

      - name: Commit and push progress file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add progress/

          if git diff --cached --quiet; then
            echo "No new reports today."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "chore: daily progress summary ${DATE}"

            echo "📥 Pulling latest changes from remote..."
            git pull --rebase origin main

            echo "📤 Pushing changes to remote..."
            git push
            echo "✅ Progress file committed."
          fi
