name: Daily Progress Summary

# Runs after all cron jobs finish (last job ends ~00:20 UTC)
on:
  schedule:
    - cron: "40 0 * * *"   # 00:40 UTC = 08:40 Taipei
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    name: Generate Progress Summary
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This is the one job that genuinely reads history (git log --since
          # below), but it only looks back 12 hours. The bots commit ~100 times
          # a day, so 500 commits is a wide margin — and far cheaper than the
          # full-history clone this used to do against a ~1 GB pack.
          fetch-depth: 500

      - name: Generate progress file
        run: |
          YYYYMMDD=$(date -u +"%Y%m%d")
          ANALYSIS_BASE_URL="https://yennanliu.github.io/finance_data/reports"
          NEWS_BASE_URL="https://yennanliu.github.io/finance_data/market_news"
          OUT="progress/progress_${YYYYMMDD}.txt"

          mkdir -p progress

          {
            echo "### Stock Analysis"
            while IFS= read -r FILE; do
              [ -z "$FILE" ] && continue
              TICKER=$(echo "$FILE" | sed -E 's#ai_gen_report/(stock|fundamental|technical)/##; s#/.*##')
              FILENAME=$(basename "$FILE" .md)
              URL="${ANALYSIS_BASE_URL}/${TICKER}/${FILENAME}/"
              echo "- [${TICKER^^} ${FILENAME}](${URL})"
            done < <(git log --since="12 hours ago" --name-only --pretty=format: -- ai_gen_report/stock ai_gen_report/fundamental ai_gen_report/technical | grep '\.md$' | sort -u)

            if [ -d ai_gen_report/market_news ]; then
              echo ""
              echo "### Market News"
              while IFS= read -r FILE; do
                [ -z "$FILE" ] && continue
                TICKER=$(echo "$FILE" | sed 's|ai_gen_report/market_news/||; s|/.*||')
                FILENAME=$(basename "$FILE" .md)
                URL="${NEWS_BASE_URL}/${TICKER}/${FILENAME}/"
                echo "- [${TICKER^^} ${FILENAME}](${URL})"
              done < <(git log --since="12 hours ago" --name-only --pretty=format: -- ai_gen_report/market_news | grep '\.md$' | sort -u)
            fi
          } > "$OUT"

          cat "$OUT"

      - name: Resolve commit date
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit and push progress file
        uses: ./.github/actions/commit-and-push
        with:
          paths: progress
          message: "chore: daily progress summary ${{ steps.meta.outputs.date }}"
