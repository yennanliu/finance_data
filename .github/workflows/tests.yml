name: Tests

# Runs the pytest suite (unit + integration). Tests are fully offline —
# network / LLM SDK / selenium / subprocess boundaries are mocked, so no API
# keys or secrets are required.

on:
  push:
    # main only. `"**"` ran the whole matrix twice for every commit on a PR
    # branch — once for the push, once for pull_request — and the concurrency
    # group below cannot dedupe them (refs/heads/x vs refs/pull/N/merge).
    # PR branches are covered by pull_request; a branch with no PR yet can
    # still be run via workflow_dispatch.
    branches: [main]
    # Kept identical to the pull_request list below. GitHub's workflow parser
    # does not officially support YAML anchors, so this stays duplicated rather
    # than risk the trigger silently never matching.
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      # All of .github, not just this file: test_workflows.py lints every
      # workflow, so a cron/case edit must run it.
      - ".github/**"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      # All of .github, not just this file: test_workflows.py lints every
      # workflow, so a cron/case edit must run it.
      - ".github/**"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Everything except the three generated-content trees (~870 MB of the
        # ~1.1 GB tip; the suite builds its fixtures under tmp_path and never
        # reads them). Non-cone patterns, because 10-k/ and 10-q/ must stay:
        # test_workflows.py inspects their ticker directories. Sparse checkout
        # also makes actions/checkout fetch with --filter=blob:none, so the
        # excluded blobs are never downloaded.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ai_gen_report/
            !/notebook_llm/
            !/investor_day/

      - name: Set up Python and dependencies
        uses: ./.github/actions/python-env
        with:
          python-version: ${{ matrix.python-version }}
          # Explicit install (not `pip install -e .`) — there is no build-system
          # backend declared, and the suite only needs the runtime deps + pytest.
          # Imports resolve via [tool.pytest.ini_options] pythonpath, no install.
          # selenium / webdriver-manager / playwright are intentionally omitted:
          # those code paths are mocked and never imported by the tests.
          # Jinja2 is here on its own, not via MkDocs: test_language_switcher.py
          # renders the theme overrides in docs/overrides/partials/, and pulling
          # the whole mkdocs-material toolchain in for one pure-Python renderer
          # would cost more than the tests it unlocks.
          packages: >-
            pytest>=7.0
            pytest-mock>=3.0
            Jinja2>=3.1
            anthropic>=0.40.0
            openai>=1.0.0
            google-genai>=1.0.0
            yfinance>=0.2.40
            beautifulsoup4>=4.14.2
            requests>=2.32.5

      - name: Run test suite
        run: python -m pytest tests/ -v
