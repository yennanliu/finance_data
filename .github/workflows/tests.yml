name: Tests

# Runs the pytest suite (unit + integration). Tests are fully offline —
# network / LLM SDK / selenium / subprocess boundaries are mocked, so no API
# keys or secrets are required.

on:
  push:
    # main only. `"**"` ran the whole matrix twice for every commit on a PR
    # branch — once for the push, once for pull_request — and the concurrency
    # group below cannot dedupe them (refs/heads/x vs refs/pull/N/merge).
    # PR branches are covered by pull_request; a branch with no PR yet can
    # still be run via workflow_dispatch.
    branches: [main]
    # Kept identical to the pull_request list below. GitHub's workflow parser
    # does not officially support YAML anchors, so this stays duplicated rather
    # than risk the trigger silently never matching.
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      # All of .github, not just this file: test_workflows.py lints every
      # workflow, so a cron/case edit must run it.
      - ".github/**"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      # All of .github, not just this file: test_workflows.py lints every
      # workflow, so a cron/case edit must run it.
      - ".github/**"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Everything except the three generated-content trees (~870 MB of the
        # ~1.1 GB tip; the suite builds its fixtures under tmp_path and never
        # reads them). Non-cone patterns, because 10-k/ and 10-q/ must stay:
        # test_workflows.py inspects their ticker directories. Sparse checkout
        # also makes actions/checkout fetch with --filter=blob:none, so the
        # excluded blobs are never downloaded.
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/ai_gen_report/
            !/notebook_llm/
            !/investor_day/

      # Installs from uv.lock, so CI tests exactly the versions `uv sync`
      # gives a developer, rather than whatever PyPI resolved that morning.
      # --locked fails the job if uv.lock is out of date with pyproject.toml
      # instead of silently re-resolving. The project has no build-system, so
      # uv treats it as a virtual project: dependencies are installed, the repo
      # itself is not, and imports resolve via [tool.pytest.ini_options]
      # pythonpath exactly as before. Unlike the cron jobs, the cache pays off
      # here: one lockfile means one stable cache key.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run test suite
        run: uv run --no-sync pytest tests/ -v
