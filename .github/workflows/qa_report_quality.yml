name: QA Report Quality Check

# Runs after all daily report-gen jobs complete.
# Last report-gen cron: NBIS technical at 01:30 UTC
# → QA runs at 02:00 UTC (30 min buffer)

on:
  schedule:
    - cron: "0 2 * * *"     # 02:00 UTC = 10:00 Taipei (after all report-gen jobs)
  workflow_dispatch:          # allow manual trigger from GitHub UI
    inputs:
      llm_review:
        description: "Run the stage-2 LLM review (costs API tokens)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      llm_review_model:
        description: "Reviewer model (blank = script default, a mini-class model)"
        required: false
        default: ""
        type: string
      llm_review_days:
        description: "How many UTC days back to review (2 covers one 17:00-03:00 gen cycle)"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

jobs:
  quality-check:
    name: Check Report Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Shallow: the audit reads the working tree, not history, and the commit
        # step only adds a commit on top of the fetched tip.

      # No packages: stage 1 (check_report_quality.py, check_mermaid.py,
      # prune_qa.py) is pure-stdlib. `openai` is installed later, immediately
      # before stage 2, so a PyPI hiccup cannot take down the free,
      # deterministic audit — stage 2 must never sit on stage 1's critical path.
      # This step once read `pip install -e ".[dev]" || pip install yfinance` —
      # the editable install always failed for want of a build-system backend,
      # so the fallback was the only thing that ever ran, and even that was
      # never imported.
      - name: Set up Python
        uses: ./.github/actions/python-env

      - name: Resolve run parameters
        id: params
        env:
          IN_LLM_REVIEW: ${{ github.event.inputs.llm_review }}
          IN_MODEL: ${{ github.event.inputs.llm_review_model }}
          IN_DAYS: ${{ github.event.inputs.llm_review_days }}
        run: |
          set -euo pipefail
          # Scheduled runs send no inputs, so each default is restated once
          # here rather than as a `|| 'x'` in every later step.
          {
            echo "date=$(date -u +%Y-%m-%d)"
            echo "llm_review=${IN_LLM_REVIEW:-true}"
            echo "days=${IN_DAYS:-2}"
            echo "model=${IN_MODEL:-}"
          } >> "$GITHUB_OUTPUT"

      - name: Run quality checker (stage 1 — deterministic, no API calls)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p qa
          python scripts/check_report_quality.py \
            --csv "qa/bad_reports_${TODAY}.csv" \
            --summary \
            | tee "qa/summary_${TODAY}.txt"

      - name: Alert on unrenderable Mermaid diagrams
        # Non-blocking (script exits 0): lists every report whose ```mermaid
        # diagram won't render on GitHub and prints the exact failed snippet as
        # warning annotations + a run-summary table. A hit means a report
        # slipped through un-sanitized — see scripts/analysis/utils/mermaid.py.
        run: python scripts/check_mermaid.py --root ai_gen_report

      # ── Stage 2: LLM review (OpenAI) ──────────────────────────────────────
      # Grades what regex cannot: fabricated numbers, shallow analysis, a
      # conclusion contradicting its own evidence, simplified-Chinese leakage.
      # Additive — stage 1 above stays the primary, free, deterministic gate.
      - name: Verify reviewer API key
        id: key
        if: steps.params.outputs.llm_review == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
        run: |
          set -euo pipefail
          # Not check_provider_keys.py: that resolves the *generation* fallback
          # chain, so it would also demand GEMINI_API_KEY, which this job never
          # uses. The reviewer needs exactly one key.
          #
          # Annotates but does not exit 1. A missing secret is a stage-2
          # configuration problem; failing the job would throw away the stage-1
          # audit that already ran and leave nothing committed. The ::error::
          # still surfaces on the run summary.
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPEN_KEY_API secret is not set — skipping the stage-2 LLM review"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "OK: OPEN_KEY_API is set"
          fi

      - name: Install reviewer dependencies
        id: deps
        if: steps.key.outputs.ok == 'true'
        continue-on-error: true    # a PyPI hiccup must not fail the stage-1 audit
        uses: ./.github/actions/python-env
        with:
          packages: openai>=1.0.0

      - name: LLM report review (stage 2 — OpenAI)
        id: review
        # Non-blocking twice over: the script exits 0 even when reports are
        # graded "fail", and continue-on-error covers the process itself dying,
        # so a bad night still produces a committed audit trail instead of a
        # red run with no artifacts.
        if: steps.key.outputs.ok == 'true' && steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_KEY_API }}
          TODAY: ${{ steps.params.outputs.date }}
          DAYS: ${{ steps.params.outputs.days }}
          MODEL: ${{ steps.params.outputs.model }}
        run: |
          set -euo pipefail
          # --days 2, not 1: report-gen crons run 17:00-03:00 UTC, so one
          # generation cycle straddles midnight and carries two date stamps.
          python scripts/review_report_quality.py \
            --days "${DAYS}" \
            ${MODEL:+--model "${MODEL}"} \
            --csv "qa/llm_review_${TODAY}.csv" \
            --summary \
            | tee "qa/llm_review_${TODAY}.txt"

      - name: Note a skipped or failed stage 2
        if: steps.params.outputs.llm_review == 'true' && steps.review.outcome != 'success'
        run: |
          echo "::warning::Stage 2 (LLM review) did not complete — \
          key=${{ steps.key.outputs.ok }} deps=${{ steps.deps.outcome }} \
          review=${{ steps.review.outcome }}. Stage 1 results are unaffected."

      - name: Prune old QA artifacts (keep 10 most recent runs)
        run: python scripts/prune_qa.py --keep 10

      - name: Generate QA index markdown
        env:
          TODAY: ${{ steps.params.outputs.date }}
          # Whether *this* run produced a stage-2 result. Without it, a
          # same-day rerun with llm_review=false would find the earlier run's
          # committed llm_review_${TODAY}.txt still in the checkout and
          # republish it as part of the current audit.
          STAGE2_OK: ${{ steps.review.outcome == 'success' }}
        run: |
          set -euo pipefail
          SUMMARY="qa/summary_${TODAY}.txt"
          CSV="qa/bad_reports_${TODAY}.csv"
          LLM_SUMMARY="qa/llm_review_${TODAY}.txt"
          LLM_CSV="qa/llm_review_${TODAY}.csv"

          # Count bad reports from CSV (subtract header line)
          BAD_COUNT=$(( $(wc -l < "$CSV") - 1 ))

          cat > "qa/README.md" << EOF
          # Report Quality Audit

          Two stages, in order. Stage 1 is deterministic and free; stage 2 asks
          an LLM to judge what regex cannot see.

          ## Stage 1 — rule-based scan (\`scripts/check_report_quality.py\`)

          | Field | Value |
          |-------|-------|
          | Last run | ${TODAY} |
          | Bad reports found | ${BAD_COUNT} |
          | CSV | [bad_reports_${TODAY}.csv](bad_reports_${TODAY}.csv) |
          | Full summary | [summary_${TODAY}.txt](summary_${TODAY}.txt) |
          | Retention | 10 most recent runs (older files pruned by \`scripts/prune_qa.py\`) |

          ## Latest Summary

          \`\`\`
          $(cat "$SUMMARY")
          \`\`\`
          EOF

          # Stage 2 is optional (skippable via workflow_dispatch), so its
          # section is appended only when *this* run produced one — the file
          # test alone would happily republish a previous same-day result.
          if [ "$STAGE2_OK" = "true" ] && [ -f "$LLM_SUMMARY" ]; then
            cat >> "qa/README.md" << EOF

          ## Stage 2 — LLM review (\`scripts/review_report_quality.py\`)

          Grades data integrity, completeness, depth, internal consistency and
          language on a 1-5 scale over a rolling 2-day window (report-gen crons
          run 17:00-03:00 UTC, so one cycle spans two date stamps).

          | Field | Value |
          |-------|-------|
          | CSV | [llm_review_${TODAY}.csv](llm_review_${TODAY}.csv) |
          | Full summary | [llm_review_${TODAY}.txt](llm_review_${TODAY}.txt) |

          \`\`\`
          $(cat "$LLM_SUMMARY")
          \`\`\`
          EOF
          else
            echo "Stage 2 not published this run (stage2_ok=${STAGE2_OK}, summary present: $([ -f "$LLM_SUMMARY" ] && echo yes || echo no))."
          fi

          # Referenced so a missing CSV alongside a present summary is loud.
          [ "$STAGE2_OK" != "true" ] || [ ! -f "$LLM_SUMMARY" ] || [ -f "$LLM_CSV" ] || {
            echo "::warning::$LLM_SUMMARY exists but $LLM_CSV does not"; }

      - name: Commit QA results
        uses: ./.github/actions/commit-and-push
        with:
          paths: qa
          message: "chore: auto-generate QA quality report ${{ steps.params.outputs.date }}"
