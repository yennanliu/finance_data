name: Deploy Finance Hub to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "ai_gen_report/**"
      - "notebook_llm/**"
      - "10-k/**"
      - "10-q/**"
      - "13-f/**"
      - "investor_day/**"
      - "README.md"
      - "mkdocs.yml"
      - "docs/**"
      - "scripts/build_docs.py"
      - ".github/workflows/deploy.yml"
  schedule:
    # ── Consolidated nightly deploy (UTC) ───────────────────────────────────
    # Runs after ALL other cron jobs complete:
    #   daily_analysis:    last job NVDA at 20:41 UTC
    #   daily_market_news: last job RKLB at 00:36 UTC
    # → Deploy at 01:10 UTC to ensure latest reports are published
    - cron: "10 1 * * *"
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build ────────────────────────────────────────────────────
  build:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for git-revision-date plugin

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MkDocs & plugins
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs-material==9.5.* \
            mkdocs-awesome-pages-plugin \
            mkdocs-minify-plugin \
            Pillow \
            cairosvg

      - name: Generate docs content
        run: python scripts/build_docs.py

      - name: Inject build date into templates
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g" docs/overrides/main.html
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g" docs/overrides/home.html
          echo "Build date set to: ${BUILD_DATE}"

      - name: Build MkDocs site
        run: mkdocs build --clean --strict

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ── Deploy ───────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
