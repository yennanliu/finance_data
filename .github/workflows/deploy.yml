name: Deploy Finance Hub to GitHub Pages

on:
  push:
    branches:
      - main
    # Perf fix #6 — debounce. Content dirs (ai_gen_report/**, notebook_llm/**,
    # SEC filings, …) are written by ~42 daily analysis jobs; deploying on each
    # push queued dozens of full-site (752 MB) builds per day. Content is now
    # published by the nightly cron below. Pushes only auto-deploy when the
    # site's own config or hand-crafted assets change.
    paths:
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - "scripts/mkdocs_minify_hook.py"
      - "scripts/mkdocs_release_hook.py"
      - ".github/actions/build-site/**"
      - ".github/actions/python-env/**"
      - ".github/workflows/deploy.yml"
      - "docs/overrides/**"
      - "docs/stylesheets/**"
      - "docs/javascripts/**"
      - "docs/includes/**"
      - "docs/assets/**"
      - "okf/**"
      - "llms.txt"
  schedule:
    # ── Consolidated nightly deploy (UTC) ───────────────────────────────────
    # Content deploys ONLY here (push-on-content is disabled above), so this
    # cron must run AFTER the full daily generation window or same-day reports
    # miss a cycle. Generation window (UTC):
    #   daily_market_news:          17:00 – 23:10  (last: ROBO)
    #   daily_analysis fundamental: 17:00 – 21:00  (last: NBIS)
    #   daily_analysis technical:   21:30 – 01:30  (last: NBIS, next day)
    #   daily_analysis fundamental: 02:00 – 03:40  (additional; last: ROBO)
    # → Last job scheduled 03:40 UTC; deploy at 04:00 UTC to capture it.
    #   (GitHub may delay scheduled crons; push this later if tail jobs are missed.)
    - cron: "0 4 * * *"
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Build ────────────────────────────────────────────────────
  build:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    # A build of an older commit is wasted work once a newer one is queued:
    # the newer checkout already contains everything. So superseded builds are
    # cancelled — the deploy job below keeps its own, non-cancelling group,
    # so a deployment that has started is never interrupted mid-sync.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    timeout-minutes: 60      # a full build is ~752 MB / tens of thousands of pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Shallow checkout (default fetch-depth: 1). The previous full-history
        # clone (fetch-depth: 0) was for a git-revision-date plugin that is not
        # installed — it only cost time cloning ~1 GB of binary history.

      # Installs the toolchain, generates content, stamps the build date and
      # runs `mkdocs build --strict`. Shared with sample_build.yml so the smoke
      # build always exercises the same plugin set this deploy installs.
      - name: Build site
        uses: ./.github/actions/build-site

      # Publish the OKF knowledge bundle + llms.txt verbatim (raw markdown,
      # unrendered) so AI agents can fetch them at /okf/... and /llms.txt.
      # Copied after `mkdocs build` because mkdocs would otherwise render the
      # .md files to HTML.
      - name: Publish OKF knowledge bundle
        run: |
          cp -r okf site/okf
          cp llms.txt site/llms.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ── Deploy ───────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Job-level permissions replace the workflow-level block, so all are
    # listed. `actions: read` lets the retry step look up the artifact ID.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: pages
      cancel-in-progress: false
    # Two deploy attempts of up to 10 min each, plus job overhead.
    timeout-minutes: 30
    steps:
      # A normal deploy finishes in 10-40 s. When it does not, the Pages
      # backend has stalled in `syncing_files` (2026-11-10: stuck for the full
      # 10 min). deploy-pages caps `timeout` at 600000 ms (MAX_TIMEOUT in
      # actions/deploy-pages src/internal/deployment.js), so a larger value
      # only logs a warning and never buys more time. Instead the first
      # attempt is allowed to fail and a second, fresh deployment is created.
      - name: Deploy to GitHub Pages
        id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000       # the action's hard maximum (10 min)
          error_count: 25       # tolerate more transient sync errors (default 10)

      # deploy-pages always sends GITHUB_SHA as pages_build_version (the
      # deployment ID) and has no input to change it. A step-level `env:`
      # override does not work either: the runner re-sets GITHUB_SHA from the
      # github context for node actions (NodeScriptActionHandler.cs). On
      # timeout deploy-pages cancels that deployment, and a new deployment with
      # the same ID never reports a status: the manual re-run of 2026-11-10
      # polled an empty status for 10 min. So the retry calls the same Pages
      # API that deploy-pages uses, with a build version unique to this
      # attempt (the API takes any unique string).
      - name: Retry deploy to GitHub Pages
        id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BUILD_VERSION: ${{ github.sha }}-retry-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          # Same OIDC token core.getIDToken() fetches (no audience).
          oidc_token=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
          echo "Creating Pages deployment: artifact $artifact_id, version $BUILD_VERSION"
          deployment_id=$(jq -n --argjson a "$artifact_id" --arg v "$BUILD_VERSION" \
              --arg t "$oidc_token" '{artifact_id: $a, pages_build_version: $v, oidc_token: $t}' \
            | gh api -X POST "repos/$REPO/pages/deployments" --input - --jq '.id // (.status_url // "" | split("/") | last) // empty')
          # Same fallback chain as deploy-pages: id, then status_url, then version.
          deployment_id=${deployment_id:-$BUILD_VERSION}

          # Poll like deploy-pages: every 5 s for at most 10 min.
          deadline=$(( $(date +%s) + 600 ))
          while (( $(date +%s) < deadline )); do
            sleep 5
            status=$(gh api "repos/$REPO/pages/deployments/$deployment_id" --jq '.status' || echo "api_error")
            echo "Current status: $status"
            case "$status" in
              succeed)
                page_url=$(gh api "repos/$REPO/pages" --jq '.html_url')
                echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "::error::Pages deployment ended with status $status"
                exit 1 ;;
            esac
          done
          echo "::error::Retry deploy timed out after 10 min; cancelling $deployment_id"
          gh api -X POST "repos/$REPO/pages/deployments/$deployment_id/cancel" || true
          exit 1

      - name: Resolve page URL
        id: deployment
        run: echo "page_url=${FIRST_URL:-$RETRY_URL}" >> "$GITHUB_OUTPUT"
        env:
          FIRST_URL: ${{ steps.deploy_first.outputs.page_url }}
          RETRY_URL: ${{ steps.deploy_retry.outputs.page_url }}
