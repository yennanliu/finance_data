name: Deploy Finance Hub to GitHub Pages

on:
  push:
    branches:
      - main
    # Perf fix #6 — debounce. Content dirs (ai_gen_report/**, notebook_llm/**,
    # SEC filings, …) are written by ~42 daily analysis jobs; deploying on each
    # push queued dozens of full-site (752 MB) builds per day. Content is now
    # published by the nightly cron below. Pushes only auto-deploy when the
    # site's own config or hand-crafted assets change.
    paths:
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - ".github/workflows/deploy.yml"
      - "docs/overrides/**"
      - "docs/stylesheets/**"
      - "docs/javascripts/**"
      - "docs/includes/**"
      - "okf/**"
      - "llms.txt"
  schedule:
    # ── Consolidated nightly deploy (UTC) ───────────────────────────────────
    # Content deploys ONLY here (push-on-content is disabled above), so this
    # cron must run AFTER the full daily generation window or same-day reports
    # miss a cycle. Generation window (UTC):
    #   daily_market_news:          17:00 – 23:10  (last: ROBO)
    #   daily_analysis fundamental: 17:00 – 21:00  (last: NBIS)
    #   daily_analysis technical:   21:30 – 01:30  (last: NBIS, next day)
    #   daily_analysis fundamental: 02:00 – 03:40  (additional; last: ROBO)
    # → Last job scheduled 03:40 UTC; deploy at 04:00 UTC to capture it.
    #   (GitHub may delay scheduled crons; push this later if tail jobs are missed.)
    - cron: "0 4 * * *"
  workflow_dispatch:      # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Build ────────────────────────────────────────────────────
  build:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Shallow checkout (default fetch-depth: 1). The previous full-history
        # clone (fetch-depth: 0) was for a git-revision-date plugin that is not
        # installed — it only cost time cloning ~2.3 GB of binary history.

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install MkDocs & plugins
        run: |
          pip install --upgrade pip
          pip install \
            mkdocs-material==9.5.* \
            mkdocs-awesome-pages-plugin \
            mkdocs-minify-plugin \
            Pillow \
            cairosvg

      - name: Generate docs content
        run: python scripts/build_docs.py

      - name: Inject build date into templates
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g" docs/overrides/main.html
          sed -i "s/__BUILD_DATE__/${BUILD_DATE}/g" docs/overrides/home.html
          echo "Build date set to: ${BUILD_DATE}"

      - name: Build MkDocs site
        run: mkdocs build --clean --strict

      # Publish the OKF knowledge bundle + llms.txt verbatim (raw markdown,
      # unrendered) so AI agents can fetch them at /okf/... and /llms.txt.
      # Copied after `mkdocs build` because mkdocs would otherwise render the
      # .md files to HTML.
      - name: Publish OKF knowledge bundle
        run: |
          cp -r okf site/okf
          cp llms.txt site/llms.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  # ── Deploy ───────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The site is large (~752 MB, tens of thousands of report files).
          # deploy-pages' default 10-min timeout / 10-error tolerance is too
          # tight for a sync this size, which surfaces as an intermittent
          # "Deployment failed, try again later." during the syncing_files
          # phase. Give the sync more room to complete.
          timeout: 1800000      # 30 min (default 600000 = 10 min)
          error_count: 25       # tolerate more transient sync errors (default 10)
