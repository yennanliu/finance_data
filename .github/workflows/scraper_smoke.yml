name: Scraper Smoke Test

# Weekly live check of the two things that only break against the real world:
#   * the annualreports.com 10-K scraper still parses the site (PDF links +
#     company name) — the site-structure changes that broke download_10k_pdf.py
#   * SEC EDGAR still answers a rolling one-year filing query with filings.
#     That one also runs against the real *calendar*: the download jobs' window
#     used to be a calendar year, which collapsed every New Year and made them
#     fetch nothing while still going green.
# Unlike tests.yml this DOES hit the network.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live scraper smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and dependencies
        uses: ./.github/actions/python-env
        with:
          python-version: "3.13"
          packages: >-
            pytest>=7.0
            beautifulsoup4>=4.14.2
            requests>=2.32.5

      - name: Run live smoke test
        env:
          RUN_LIVE: "1"
        run: python -m pytest tests/test_downloads_live.py -v -m live
