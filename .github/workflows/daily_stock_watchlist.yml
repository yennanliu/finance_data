name: Daily Stock Watchlist

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC → 06:00 UTC+8 (before market open)

  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model"
        required: false
        default: "gemini-3.5-flash"
        type: choice
        options:
          # Gemini 3.x models (latest)
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
          - gemini-3.1-flash-lite
          # Gemini 2.5 models (stable)
          - gemini-2.5-flash
          - gemini-2.5-pro
          - gemini-2.5-flash-lite
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "16000"

permissions:
  contents: read    # output goes to an artifact; only collect_daily.yml writes

concurrency:
  # Static group is safe here: one cron a day, so this only ever guards the
  # cron against a concurrent manual dispatch. (Was run_id-keyed = a no-op.)
  #
  # Queue behaviour worth knowing: GitHub holds only ONE pending run per group.
  # With a run in progress, dispatching twice in quick succession cancels the
  # older pending run — the newer dispatch replaces it. There is no queue-depth
  # setting to change this (concurrency accepts only `group` and
  # `cancel-in-progress`); the alternative, dropping the group, would instead
  # let two runs race on the same ws/ output file, which is worse. At one cron
  # a day plus the occasional manual run, a three-deep queue is not a real case.
  group: "daily-stock-watchlist"
  cancel-in-progress: false

jobs:
  generate-watchlist:
    name: Generate Fundamental Stock Watchlist
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install google-genai>=1.0.0

      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            exit 1
          fi
          echo "✅ GEMINI_API_KEY is set."

      - name: Generate watchlist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODEL="${{ github.event.inputs.model || 'gemini-3.5-flash' }}"
          MAX_TOKENS="${{ github.event.inputs.max_tokens || '16000' }}"
          python scripts/generate_stock_watchlist.py \
            --model "$MODEL" \
            --max-tokens "$MAX_TOKENS"

      # Hands off to collect_daily.yml rather than committing.
      - name: Resolve cycle name
        id: cycle
        run: echo "date=$(python scripts/cycle.py)" >> "$GITHUB_OUTPUT"

      - name: Stage watchlist
        id: stage
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/cycle-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          git add -A ws/ 2>/dev/null || true

          COUNT=0
          while IFS= read -r -d '' f; do
            mkdir -p "$STAGE/$(dirname "$f")"
            cp "$f" "$STAGE/$f"
            COUNT=$((COUNT + 1))
          done < <(git diff --cached --name-only --diff-filter=ACM -z)

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "dir=$STAGE" >> "$GITHUB_OUTPUT"
          echo "📦 Staged $COUNT file(s) for cycle ${{ steps.cycle.outputs.date }}."

      - name: Upload watchlist artifact
        if: steps.stage.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ steps.cycle.outputs.date }}-watchlist
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: 7
