name: Daily Stock Watchlist

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC → 06:00 UTC+8 (before market open)

  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model"
        required: false
        default: "gemini-3.5-flash"
        type: choice
        options:
          # Gemini 3.x models (latest)
          - gemini-3.8-flash
          - gemini-3.5-flash
          - gemini-3.1-pro-preview
          - gemini-3.1-flash-lite
          # Gemini 2.5 models (stable)
          - gemini-2.5-flash
          - gemini-2.5-pro
          - gemini-2.5-flash-lite
      max_tokens:
        description: "Max output tokens"
        required: false
        default: "16000"

permissions:
  contents: write

concurrency:
  # Static group is safe here: one cron a day, so this only ever guards the
  # cron against a concurrent manual dispatch. (Was run_id-keyed = a no-op.)
  #
  # Queue behaviour worth knowing: GitHub holds only ONE pending run per group.
  # With a run in progress, dispatching twice in quick succession cancels the
  # older pending run — the newer dispatch replaces it. There is no queue-depth
  # setting to change this (concurrency accepts only `group` and
  # `cancel-in-progress`); the alternative, dropping the group, would instead
  # let two runs race on the same ws/ output file, which is worse. At one cron
  # a day plus the occasional manual run, a three-deep queue is not a real case.
  group: "daily-stock-watchlist"
  cancel-in-progress: false

jobs:
  generate-watchlist:
    name: Generate Fundamental Stock Watchlist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Defaults for the scheduled run, which supplies no inputs. Matches the
      # job-env pattern used by daily_market_news.yml.
      DEFAULT_MODEL: gemini-3.5-flash
      DEFAULT_MAX_TOKENS: "16000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Shallow: nothing here reads history.

      - name: Set up Python and dependencies
        uses: ./.github/actions/python-env
        with:
          packages: google-genai>=1.0.0

      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set."
            exit 1
          fi
          echo "✅ GEMINI_API_KEY is set."

      - name: Generate watchlist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IN_MODEL: ${{ github.event.inputs.model }}
          IN_MAX_TOKENS: ${{ github.event.inputs.max_tokens }}
        run: |
          set -euo pipefail
          python scripts/generate_stock_watchlist.py \
            --model      "${IN_MODEL:-$DEFAULT_MODEL}" \
            --max-tokens "${IN_MAX_TOKENS:-$DEFAULT_MAX_TOKENS}"

      - name: Resolve commit date
        id: meta
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Commit and push watchlist
        uses: ./.github/actions/commit-and-push
        with:
          paths: ws
          message: "chore: auto-generate stock watchlist ${{ steps.meta.outputs.date }}"
