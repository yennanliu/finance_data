site_name: Finance Data Research Hub
site_url: https://yennanliu.github.io/finance_data/
site_description: >-
  A curated collection of investment research reports, SEC filings analysis,
  and AI-generated fundamental insights covering US equities.
site_author: yennanliu
repo_name: yennanliu/finance_data
repo_url: https://github.com/yennanliu/finance_data
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# ── Theme ────────────────────────────────────────────────────────────────────
theme:
  name: material
  custom_dir: docs/overrides
  language: zh-TW
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: 切換至深色模式
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: 切換至淺色模式
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/finance
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# ── Navigation ────────────────────────────────────────────────────────────────
# (auto-generated by scripts/build_docs.py — overwritten on each build)

# ── Plugins ──────────────────────────────────────────────────────────────────
plugins:
  - search:
      lang:
        - en
        - zh
  - awesome-pages
  - minify:
      minify_html: true

# ── Markdown extensions ──────────────────────────────────────────────────────
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: 目錄
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: yennanliu
      repo: finance_data
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ── Extra ─────────────────────────────────────────────────────────────────────
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yennanliu/finance_data
      name: GitHub Repository
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
