site_name: Finance Data Research Hub
site_url: https://yennanliu.github.io/finance_data/
site_description: >-
  A curated collection of investment research reports, SEC filings analysis,
  and AI-generated fundamental insights covering US equities.
site_author: yennanliu
repo_name: yennanliu/finance_data
repo_url: https://github.com/yennanliu/finance_data
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# ── Validation ────────────────────────────────────────────────────────────────
# Individual dated report/news pages are intentionally excluded from the nav
# (perf fix #2b in build_docs.py) — they stay reachable via per-ticker index
# tables. Keep "pages not in nav" at INFO so `mkdocs build --strict` does not
# treat these deliberate omissions as errors.
validation:
  nav:
    omitted_files: info

# ── Theme ────────────────────────────────────────────────────────────────────
theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    # Dark mode (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: false
    code: false
  icon:
    repo: fontawesome/brands/github
    logo: material/finance
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    # navigation.expand removed (perf): forced the full 5k-page tree to render
    # expanded into every page (~1 MB HTML each). navigation.prune emits only
    # the nav subtree for the current page, cutting per-page weight ~80-95%.
    - navigation.prune
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

# ── Navigation ────────────────────────────────────────────────────────────────
# (auto-generated by scripts/build_docs.py — overwritten on each build)

# ── Plugins ──────────────────────────────────────────────────────────────────
plugins:
  - search:
      lang:
        - en
        - zh
  - awesome-pages
  - minify:
      minify_html: true

# ── Markdown extensions ──────────────────────────────────────────────────────
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Table of Contents
  - tables
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: yennanliu
      repo: finance_data
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# ── Extra ─────────────────────────────────────────────────────────────────────
extra:
  alternate:
    - name: English
      link: /finance_data/
      lang: en
    - name: 繁體中文
      link: /finance_data/zh/
      lang: zh-TW
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yennanliu/finance_data
      name: GitHub Repository
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/kline.css
  - stylesheets/prices.css

extra_javascript:
  - javascripts/clickable-rows.js
  - javascripts/responsive-tables.js
  # TradingView-style K線 chart at the top of each report page.
  # The library must load before kline-chart.js (order is preserved).
  - javascripts/lightweight-charts.standalone.production.js
  - javascripts/kline-chart.js
  # Derived-analytics charts (drawdown / volatility / return distribution) on
  # the Price Data pages — shares the same charting library.
  - javascripts/price-charts.js
