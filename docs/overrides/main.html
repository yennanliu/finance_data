{% extends "base.html" %}

{% block header %}
  {{ super() }}
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    // Add home button and set build date after page loads
    function initCustomElements() {
      // Add home button if not already present
      var header = document.querySelector(".md-header__inner");
      if (header && !header.querySelector(".md-header__home-btn")) {
        var homeBtn = document.createElement("a");
        homeBtn.href = "{{ config.site_url }}";
        homeBtn.className = "md-header__home-btn";
        homeBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1rem;height:1rem"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span>';

        var title = header.querySelector(".md-header__title");
        if (title && title.parentNode) {
          title.parentNode.insertBefore(homeBtn, title.nextSibling);
        }
      }
    }

    // Run on initial load
    document.addEventListener("DOMContentLoaded", initCustomElements);

    // Run on instant navigation (MkDocs Material SPA mode)
    if (typeof document$ !== "undefined") {
      document$.subscribe(function() {
        initCustomElements();
      });
    }
  </script>
{% endblock %}

{% block footer %}
  {{ super() }}
  <div class="md-footer__build-info">
    <span>Build: __BUILD_DATE__</span>
    <span style="margin: 0 0.5rem;">|</span>
    <span>v1.0.0</span>
    <span style="margin: 0 0.5rem;">|</span>
    <span>MkDocs Material</span>
  </div>
{% endblock %}
