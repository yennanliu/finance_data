[project]
name = "finance-data"
version = "0.1.0"
description = "US stock investment research with AI-powered analysis and technical charts"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "yfinance>=0.2.40",
    "plotly>=5.0.0",
    "beautifulsoup4>=4.14.2",
    "requests>=2.32.5",
    "selenium>=4.36.0",
    "webdriver-manager>=4.0.2",
    "matplotlib>=3.8.0",
    "mplfinance>=0.12.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
